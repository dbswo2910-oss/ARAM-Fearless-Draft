<title>NOIR Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen mobile app — top bar, scrolling body, pinned composer. Dark-only by design (a night-bar mood). */
:root {
  --ink: #0d0b10;
  --bg: #121016;
  --surface: #1a171f;
  --surface-2: #231f29;
  --surface-3: #2e2935;
  --line: #34303c;
  --text: #efe9f0;
  --dim: #a9a1b2;
  --faint: #756e7f;
  --amber: #e9ac83;
  --amber-ink: #2b1a10;
  --wine: #3b2730;
  --wine-line: #533744;
  --rose: #dd8296;
  --danger: #ea6b74;
  --ok: #86cba8;
  --display: 'Gowun Batang', 'Noto Serif KR', 'Apple SD Gothic Neo', Georgia, serif;
  --body: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.6;
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

#app { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; position: relative; }
.bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 6px;
  border-bottom: 1px solid var(--surface-2); background: var(--bg);
}
.bar h2 { margin: 0; font-size: 16px; font-weight: 700; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark { font-family: var(--display); font-weight: 700; letter-spacing: .22em; font-size: 18px; margin-right: auto; }
.mark i { font-style: normal; color: var(--amber); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 14px; }

.icon { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--dim); display: grid; place-items: center; flex-shrink: 0; }
.icon:hover { background: var(--surface-2); color: var(--text); }
.icon svg { width: 22px; height: 22px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; font-size: 14px; white-space: nowrap;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 700; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.danger { color: var(--danger); border-color: rgba(234, 107, 116, .35); background: transparent; }
.btn.sm { min-height: 34px; padding: 0 13px; font-size: 13px; }
.btn.block { width: 100%; }

h1 { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.3; margin: 4px 0 0; text-wrap: balance; }
.lead { color: var(--dim); font-size: 14px; margin: 0; }
.label { font-size: 12px; letter-spacing: .08em; color: var(--faint); font-weight: 700; margin: 14px 0 -4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--dim); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pill.warn .dot { background: var(--amber); }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--dim); }
.note.err { border-color: rgba(234, 107, 116, .35); color: #f2b0b6; }

/* 이어서 대화하기 */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; background: var(--surface); border: 1px solid transparent; text-align: left; width: 100%; }
.row:hover { border-color: var(--line); }
.row .body { flex: 1; min-width: 0; }
.row b { display: block; font-size: 14.5px; font-weight: 700; }
.row small { display: block; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row time { color: var(--faint); font-size: 12px; flex-shrink: 0; }

.ava { border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; overflow: hidden; flex-shrink: 0; font-family: var(--display); color: var(--amber); font-weight: 700; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 캐릭터 카드 */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { position: relative; border-radius: 16px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
.cover { aspect-ratio: 4 / 5; max-width: 100%; position: relative; display: grid; place-items: center; background: linear-gradient(165deg, #2d2333, #16131a 72%); border: 0; padding: 0; width: 100%; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .init { font-family: var(--display); font-size: 58px; color: rgba(233, 172, 131, .45); }
.cover::after { content: ''; position: absolute; inset: 42% 0 0; background: linear-gradient(transparent, rgba(13, 11, 16, .94)); }
.meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; z-index: 1; text-align: left; }
.meta b { font-size: 17px; display: block; }
.meta b span { font-weight: 400; color: var(--faint); font-size: 13px; margin-left: 4px; }
.meta small { color: var(--dim); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
.tag { position: absolute; top: 9px; left: 9px; z-index: 1; }
.card .acts { display: flex; gap: 4px; padding: 8px; }
.card .acts .btn { flex: 1; padding: 0 8px; }
.newcard { border: 1px dashed var(--line); border-radius: 16px; background: transparent; color: var(--dim); display: grid; place-items: center; min-height: 200px; gap: 4px; }
.newcard:hover { border-color: var(--amber); color: var(--amber); }
.newcard span { font-size: 32px; line-height: 1; display: block; }
.example { border: 1px solid var(--wine-line); }

/* 폼 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--dim); font-weight: 500; }
.field small { color: var(--faint); font-size: 12px; line-height: 1.45; }
.in, .ta, .sel { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; outline: none; font-size: 15px; }
.in:focus, .ta:focus, .sel:focus { border-color: var(--amber); }
.ta { resize: vertical; min-height: 80px; line-height: 1.55; }
.trio { display: grid; grid-template-columns: minmax(0, 1fr) 84px 96px; gap: 10px; }
.group { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.group h3 { margin: 0; font-size: 15px; }
.avatar-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.err-text { color: var(--danger); font-size: 13.5px; }
.footer-acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice label { flex: 1; min-width: 130px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.choice label:has(input:checked) { border-color: var(--amber); background: rgba(233, 172, 131, .07); }
.choice input { accent-color: var(--amber); margin-top: 5px; }
.choice b { display: block; font-size: 14px; }
.choice small { color: var(--faint); font-size: 12px; }

/* 채팅 */
.msgs { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 18px 12px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 9px; align-items: flex-start; }
.msg.u { justify-content: flex-end; }
.bub {
  max-width: 86%; min-width: 0; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word;
  line-height: 1.7; font-size: 15.5px; border: 1px solid transparent; text-align: left;
}
.msg.a .bub { background: var(--surface); border-color: var(--surface-2); border-top-left-radius: 6px; }
.msg.u .bub { background: var(--wine); border-color: var(--wine-line); border-top-right-radius: 6px; }
.bub em { font-style: italic; color: var(--dim); }
.msg.u .bub em { color: #d9b7a3; }
.bub .flag { display: block; margin-top: 4px; font-size: 11.5px; color: var(--faint); font-style: normal; }
.caret { display: inline-block; width: 7px; height: 1em; background: var(--amber); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dots { display: inline-flex; gap: 4px; align-items: center; color: var(--faint); font-size: 13px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: hop 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.intro { text-align: center; padding: 26px 8px 6px; color: var(--dim); font-size: 13.5px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.intro b { font-family: var(--display); font-size: 21px; color: var(--text); }
.memo-hint { align-self: center; font-size: 12px; color: var(--faint); background: var(--surface); border-radius: 999px; padding: 3px 12px; }

.dock { flex-shrink: 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 6px 10px; background: var(--bg); display: flex; flex-direction: column; gap: 7px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips:empty { display: none; }
.chip { flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); color: var(--dim); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip:hover { color: var(--text); }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 5px 5px 5px 16px; }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; max-height: 160px; padding: 9px 0; font-size: 16px; line-height: 1.45; }
.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; flex-shrink: 0; }
.send:disabled { background: var(--surface-3); color: var(--faint); }
.send.stop { background: var(--surface-3); color: var(--text); }
.send svg { width: 20px; height: 20px; }
.hint { text-align: center; color: var(--faint); font-size: 11.5px; }

/* 시트 */
#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 4, 7, .62); }
.panel {
  width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-top: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 6px; animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--surface-3); align-self: center; margin-bottom: 6px; }
.panel h3 { margin: 4px 0 6px; font-size: 16px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 6px; border: 0; background: transparent; border-radius: 12px; text-align: left; font-size: 15px; }
.item:hover { background: var(--surface-2); }
.item.red { color: var(--danger); }
.item small { color: var(--faint); font-size: 12.5px; display: block; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--surface-3); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
}
</style>

<div id="app" aria-live="polite"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

// ---------- 유틸 ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rich = (s) => esc(s).replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
const newId = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const clone = (o) => JSON.parse(JSON.stringify(o));
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
};
function timeAgo(t) {
  if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  const d = Math.floor(h / 24);
  if (d < 7) return d + '일 전';
  return new Date(t).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
}
function ava(ch, size) {
  const name = ch?.name || '?';
  return `<div class="ava" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px">${ch?.avatar ? `<img src="${esc(ch.avatar)}" alt="">` : esc(name.slice(0, 1))}</div>`;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 2600);
}

// ---------- 성인 캐릭터 규칙 ----------
const MIN_AGE = 19;
const MINOR_KO = ['미성년', '초등학생', '중학생', '고등학생', '초딩', '중딩', '고딩', '여중생', '남중생', '여고생', '남고생', '어린 소녀', '어린 소년', '사춘기 전'];
const MINOR_EN = ['minor', 'underage', 'under-age', 'loli', 'lolita', 'shota', 'preteen', 'pre-teen', 'schoolgirl', 'schoolboy', 'middle school', 'high school student', 'elementary school'];
const TEEN_RE = /(?:^|[^0-9])(1[0-8]|[1-9])\s*(?:살|세)(?![0-9])(?!\s*(?:연상|연하|차이|많|어린|위|아래|때|무렵|부터|에|이후|이전|전|후|까지))/;
const TEEN_EN = /\b(thirteen|fourteen|fifteen|sixteen|seventeen|eighteen)[- ]year[- ]old\b|\b1[0-7][- ]?(?:yo|y\/o|years? old)\b/i;
function minorHits(text) {
  const hits = new Set();
  for (const t of MINOR_KO) if (new RegExp(t + '(?!\\s*(?:때|시절|시기|이었|였던|였을|무렵))').test(text)) hits.add(t);
  for (const t of MINOR_EN) if (new RegExp('\\b' + t.replace(/[-/]/g, '[- ]?') + '\\b', 'i').test(text)) hits.add(t);
  const m = text.match(TEEN_RE); if (m) hits.add(m[0].trim());
  const e = text.match(TEEN_EN); if (e) hits.add(e[0]);
  return [...hits];
}

// ---------- 상태 ----------
const S = {
  mode: 'loading',            // loading | db | local
  syncSlow: false,
  profile: { userName: '나', persona: '', speed: 'quick' },
  chars: {}, convs: {},
  busy: null,                 // { id, text, ctl }
  err: '',
};
let sample = null, tts = null, downloads = null, col = null;
let route = { name: 'home', id: null };

// ---------- 저장소 (PC·휴대폰 동기화 = db, 아니면 이 브라우저) ----------
const LS = 'noir-chat-v1';
function lsAll() { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch { return {}; } }
function lsPut(all) { try { localStorage.setItem(LS, JSON.stringify(all)); return true; } catch { return false; } }
function applyDocs(map) {
  const chars = {}, convs = {}; let profile = { ...S.profile };
  for (const [k, v] of Object.entries(map)) {
    if (!v) continue;
    if (k === 'profile') profile = { ...profile, ...v };
    else if (k.startsWith('ch-')) chars[k.slice(3)] = v;
    else if (k.startsWith('cv-')) convs[k.slice(3)] = v;
  }
  // 생성 중인 대화는 화면의 최신 상태를 유지
  if (S.busy && S.convs[S.busy.id]) convs[S.busy.id] = S.convs[S.busy.id];
  S.chars = chars; S.convs = convs; S.profile = profile;
}
function snapshotAll() {
  const all = { profile: S.profile };
  for (const [id, c] of Object.entries(S.chars)) all['ch-' + id] = c;
  for (const [id, c] of Object.entries(S.convs)) all['cv-' + id] = c;
  return all;
}
const queue = {};
function saveDoc(key, data) {
  const body = clone(data);
  if (S.mode !== 'db') {
    const all = lsAll(); all[key] = body;
    if (!lsPut(all)) toast('이 브라우저의 저장 공간이 가득 찼어요. 설정에서 백업 후 오래된 대화를 지워 주세요.');
    return;
  }
  const q = (queue[key] ||= { next: null, running: false });
  q.next = body;
  if (!q.running) flush(key);
}
async function flush(key) {
  const q = queue[key]; q.running = true;
  while (q.next) {
    const body = q.next; q.next = null;
    try { await col.doc(key).set(body); }
    catch (e) { dbFail(e); break; }
  }
  q.running = false;
}
function removeDoc(key) {
  if (S.mode !== 'db') { const all = lsAll(); delete all[key]; lsPut(all); return; }
  col.doc(key).delete().catch(dbFail);
}
function dbFail(e) {
  if (e?.code === 'quota_exceeded') return toast('저장 공간이 가득 찼어요. 오래된 대화를 지워 주세요.');
  if (e?.code === 'resource_exhausted' || e?.code === 'unavailable') return toast('저장이 잠시 지연되고 있어요.');
  // 쓰기 권한이 없거나 저장소를 쓸 수 없음 → 이 브라우저 저장으로 전환
  toLocal(true);
}
function toLocal(carry) {
  if (S.mode === 'local') return;
  if (carry) lsPut({ ...lsAll(), ...snapshotAll() });
  else applyDocs(lsAll());
  S.mode = 'local';
  if (carry) toast('동기화 저장소를 쓸 수 없어 이 브라우저에 저장합니다.');
  refresh();
}
const saveConv = (id) => S.convs[id] && saveDoc('cv-' + id, trimConv(S.convs[id]));
const saveChar = (id) => S.chars[id] && saveDoc('ch-' + id, S.chars[id]);
const saveProfile = () => saveDoc('profile', S.profile);
function trimConv(cv) {
  // 문서 1개 256KB 한도: 가장 오래된(이미 기억에 요약된) 메시지부터 정리
  while (JSON.stringify(cv).length > 200000 && cv.messages.length > 60) {
    cv.messages.shift();
    cv.memUpto = Math.max(0, (cv.memUpto || 0) - 1);
  }
  return cv;
}

// ---------- 라우팅 ----------
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'new') return { name: 'edit', id: null };
  if (h === 'me') return { name: 'me', id: null };
  if (h.startsWith('e-')) return { name: 'edit', id: h.slice(2) };
  if (h.startsWith('c-')) return { name: 'chat', id: h.slice(2) };
  return { name: 'home', id: null };
}

async function shrink(file, max) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.82);
}

  box.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); onSend(); } };
  $('#sendBtn').onclick = onSend;
  $('#scroller').onscroll = () => { const s = $('#scroller'); stick = s.scrollHeight - s.scrollTop - s.clientHeight < 140; };
}
let stick = true;
function renderHead() {

  $('#head').innerHTML = `<button class="icon" data-go="" aria-label="뒤로">${ICON.back}</button>${ava(ch, 36)}<h2>${esc(ch.name)}<br><small style="font-weight:400;color:var(--faint);font-size:12px">${esc(cv.title)}</small></h2><button class="icon" id="chatMenu" aria-label="대화 메뉴">${ICON.menu}</button>`;

}
function renderMsgs(jump) {

  if (cv.memory) html += `<button class="memo-hint" id="memoHint">지난 이야기를 기억하고 있어요 · 보기</button>`;

    <div class="msg ${m.r}">${m.r === 'a' ? '' : ''}<button class="bub" data-i="${i}">${rich(m.c)}${m.s === 'partial' ? '<span class="flag">중간에 멈춘 답변</span>' : ''}</button></div>`).join('');
  if (busy) html += `<div class="msg a"><div class="bub" id="live">${S.busy.text ? rich(S.busy.text) + '<span class="caret"></span>' : '<span class="dots"><i></i><i></i><i></i>&nbsp;생각하는 중</span>'}</div></div>`;

  if (!busy && cv.messages.length <= 1) h += '<button class="chip" data-fill="*조용히 옆자리에 앉는다* ">*행동*으로 시작하기</button>';

function setErr(msg) {

  const dock = $('.dock'); if (!dock) return;

  if (msg) dock.insertAdjacentHTML('afterbegin', `<div class="note err" id="errNote">${esc(msg)}</div>`);
}
function onSend() {

  const box = $('#box'); const text = box.value.trim(); if (!text || !sample) return;
  const cv = S.convs[route.id];
  cv.messages.push({ r: 'u', c: text, t: Date.now() }); cv.updatedAt = Date.now();
  box.value = ''; box.style.height = 'auto';
  stick = true; saveConv(route.id); renderMsgs(); generate(route.id);
}

const WINDOW = 30;
function rules(ch, cv) {
  const user = S.profile.userName || '나';
  const f = (t) => fill(t, ch);
  const sec = (title, body) => (body && String(body).trim() ? `\n[${title}]\n${String(body).trim()}\n` : '');
  return `너는 지금부터 한국어 1:1 캐릭터 롤플레이에서 "${ch.name}" 한 사람만 연기한다. 상대는 ${user}이다.

[연기 규칙]
- 자연스러운 한국어 구어체로 말한다. 번역투나 설명조를 피한다.
- ${ch.name}의 성격, 말투, ${user}와의 관계를 끝까지 유지한다. AI라고 밝히거나 설정 밖의 해설을 덧붙이지 않는다.
- 행동과 표정은 *별표* 안에 짧게 쓰고, 대사는 그대로 쓴다. 이름표("${ch.name}:")를 붙이지 않는다.
- ${user}의 대사, 행동, 감정을 대신 정하지 않는다. ${user}가 반응할 여지를 남기고 멈춘다.
- 같은 표현을 반복하지 않고 장면을 조금씩 앞으로 움직인다. 지난 이야기와 기억을 자연스럽게 활용한다.
- 답변은 대화 흐름에 맞게 1~4문단.
- 설렘, 질투, 스킨십 직전의 긴장 같은 로맨스 감정은 섬세하게 표현해도 된다. 다만 성적인 장면은 노골적으로 묘사하지 않고, 분위기를 암시한 뒤 시간을 건너뛰어 다음 장면으로 넘어간다.
- 등장인물은 모두 성인이다.
${sec('캐릭터', `이름: ${ch.name} / 나이: ${ch.age}세${ch.gender ? ' / 성별: ' + ch.gender : ''}${ch.tagline ? '\n소개: ' + f(ch.tagline) : ''}`)}${sec('외모', f(ch.appearance))}${sec('성격', f(ch.personality))}${sec('말투', f(ch.speech))}${sec('배경', f(ch.background))}${sec('세계관', f(ch.world))}${sec(user + '와의 관계', f(ch.relationship))}${sec('추가 지침', f(ch.extra))}${sec('상대(' + user + ') 정보', f(S.profile.persona))}${sec('지금까지의 이야기 (장기 기억)', cv.memory)}${sec('말투 예시 — 참고만 하고 그대로 반복하지 말 것', f(ch.examples))}
이 안내에는 대답하지 말고, 이어지는 대화에서 ${ch.name}으로서만 답하라.`;
}
function buildTurns(cv, ch, cont) {
  const turns = [{ role: 'user', content: rules(ch, cv) }];
  for (const m of cv.messages.slice(-WINDOW)) if (m.c.trim()) turns.push({ role: m.r === 'u' ? 'user' : 'assistant', content: m.c });
  const last = turns[turns.length - 1];
  if (cont) turns.push({ role: 'user', content: `(${ch.name}의 방금 말과 행동에 바로 이어서, 같은 장면을 계속 써 줘.)` });
  else if (last.role === 'assistant') turns.push({ role: 'user', content: '(계속)' });
  return turns;
}
function cleanReply(text, ch) {
  return text.trim().replace(new RegExp('^\\s*' + ch.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[:：]\\s*'), '');
}
const ERR = {
  rate_limited: '잠깐 사이에 너무 많이 요청했어요. 조금 뒤에 다시 보내 주세요.',
  not_granted: 'AI 사용을 허용해야 대화할 수 있어요. 페이지를 새로고침하면 다시 물어봅니다.',
  sampling_disabled: '이 계정에서는 AI 대화를 쓸 수 없어요.',
  session_expired: 'claude.ai에 다시 로그인해 주세요.',
  prompt_too_large: '대화가 너무 길어요. 새 대화를 시작해 주세요.',
  empty_completion: '답이 비어 있었어요. 다시 쓰기를 눌러 보세요.',
};
async function generate(id, { cont = false } = {}) {
  const cv = S.convs[id]; if (!cv || S.busy || !sample) return;
  const ch = S.chars[cv.charId];
  const ctl = new AbortController();
  S.busy = { id, text: '', ctl }; setErr(''); stick = true;
  if (route.id === id) { renderMsgs(); renderChips(); updateSend(); }
  let reply = null, partial = false;
  try {
    const r = await sample(buildTurns(cv, ch, cont), {
      cache: false, signal: ctl.signal, modelTier: S.profile.speed === 'default' ? 'default' : 'quick',
      onText: ({ text }) => { S.busy.text = text; if (route.name === 'chat' && route.id === id) updateLive(); },
    });
    reply = cleanReply(r.text, ch); partial = r.truncated;
  } catch (e) {
    if (e?.code === 'refused') setErr('이 방향으로는 이어갈 수 없었어요. 표현을 바꾸거나 다른 장면으로 이어가 보세요.');
    else {
      if (e?.text) { reply = cleanReply(e.text, ch); partial = true; }
      if (e?.code !== 'cancelled') setErr(ERR[e?.code] || '연결이 잠시 끊겼어요. 다시 쓰기를 눌러 주세요.');
    }
  }
  S.busy = null;
  const now = S.convs[id];
  if (now && reply) {
    now.messages.push({ r: 'a', c: reply, t: Date.now(), ...(partial ? { s: 'partial' } : {}) });
    now.updatedAt = Date.now(); saveConv(id);
  }
  if (route.name === 'chat' && route.id === id) { renderMsgs(); renderChips(); updateSend(); }
  if (reply && !partial) summarize(id);
}
function regenerate() {
  const cv = S.convs[route.id]; if (!cv || S.busy) return;
  if (cv.messages[cv.messages.length - 1]?.r === 'a' && cv.messages.length > 1) cv.messages.pop();
  saveConv(route.id); renderMsgs(); generate(route.id);
}

// 장기 기억: 대화창 밖으로 밀려나는 부분을 요약해 관계 변화와 함께 보관
async function summarize(id) {
  const cv = S.convs[id]; if (!cv || !sample) return;
  const end = cv.messages.length - WINDOW; const from = cv.memUpto || 0;
  if (end - from < 12) return;
  const ch = S.chars[cv.charId]; const user = S.profile.userName || '나';
  const log = cv.messages.slice(from, end).map((m) => `${m.r === 'u' ? user : ch.name}: ${m.c}`).join('\n').slice(-24000);
  const prompt = `다음은 ${ch.name}(캐릭터)와 ${user}의 롤플레이 대화 일부와, 지금까지의 기억 요약이다. 둘을 합쳐 앞으로의 대화에 필요한 장기 기억을 한국어로 갱신하라.
형식(그대로, 다른 말 없이):
- 관계: 지금 두 사람의 관계와 감정의 온도, 호칭 변화
- 있었던 일: 시간순 핵심 사건 (짧은 불릿 여러 개)
- ${user}에 대해 알게 된 것:
- 약속·남은 이야기:
전체 1200자 이내. 성적인 내용은 "가까워졌다" 정도로만 요약.

[기존 기억]
${cv.memory || '(없음)'}

[새 대화]
${log}`;
  try {
    const { text } = await sample(prompt, { modelTier: 'quick', cache: false });
    const c = S.convs[id]; if (!c) return;
    c.memory = text.trim().slice(0, 3000); c.memUpto = end; saveConv(id);
    if (route.name === 'chat' && route.id === id) renderMsgs();
  } catch { /* 다음 답변 뒤 다시 시도 */ }
}

function openSheet(html, bind) {

}
function closeSheet() { const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function msgMenu(i) {
  const cv = S.convs[route.id]; const m = cv?.messages[i]; if (!m) return;
  const isLast = i === cv.messages.length - 1;
  const ch = S.chars[cv.charId];
  openSheet(`
    <button class="item" data-a="copy">복사</button>
    <button class="item" data-a="edit">수정</button>
    ${m.r === 'a' && tts ? '<button class="item" data-a="speak">듣기<small>대사만 읽어 줘요</small></button>' : ''}
    ${m.r === 'a' && isLast && i > 0 && !S.busy ? '<button class="item" data-a="regen">다시 쓰기</button>' : ''}
    <button class="item red" data-a="del">삭제</button>`, (sh) => {
    sh.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'copy') { try { await navigator.clipboard.writeText(m.c); toast('복사했어요'); } catch { toast('복사할 수 없는 환경이에요'); } closeSheet(); }
      if (a === 'edit') editMsg(i);
      if (a === 'regen') { closeSheet(); regenerate(); }
      if (a === 'speak') { closeSheet(); speak(m.c, ch); }
      if (a === 'del') {
        if (b.dataset.armed) {
          cv.messages.splice(i, 1);
          if (i < (cv.memUpto || 0)) cv.memUpto--;
          saveConv(route.id); closeSheet(); renderMsgs(); renderChips();
        } else { b.dataset.armed = '1'; b.textContent = '정말 삭제할까요? 한 번 더 누르기'; }
      }
    }));

}
function editMsg(i) {
  const cv = S.convs[route.id]; const m = cv.messages[i];
  const canRegen = m.r === 'u' && !S.busy;
  openSheet(`<h3>메시지 수정</h3>
    <textarea class="ta" id="editBox" rows="6" maxlength="4000">${esc(m.c)}</textarea>
    <div class="footer-acts" style="margin-top:8px">
      <button class="btn ghost" id="eCancel">취소</button>

    </div>
    ${canRegen ? '<small class="lead" style="font-size:12px">\'여기서 다시\'는 이 메시지 뒤의 대화를 지우고 새 답을 받아요.</small>' : ''}`, () => {

}
async function speak(text, ch) {
  const lines = text.replace(/\*[^*\n]+\*/g, ' ').replace(/\s+/g, ' ').trim();
  if (!lines) return toast('읽을 대사가 없어요');
  try { await tts.speak(lines.slice(0, 2000), { voice: ch.voice || 'buttery', language: 'ko' }); }
  catch (e) { if (e?.code === 'not_granted') { tts = null; toast('듣기 기능이 꺼져 있어요'); } else if (e?.code !== 'viewer_stopped') toast('지금은 읽어 줄 수 없어요'); }
}

// ---------- 시작 ----------
async function init() {
  route = parseHash();
  render();
  const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [dbx, user, sm, tt, dl] = await Promise.all([use('db'), use('user'), use('sample'), use('tts'), use('downloads')]);
  sample = sm; tts = tt; downloads = dl;
  const uid = user ? await user.id().catch(() => null) : null;
  if (!dbx || !uid) { S.mode = 'loading'; toLocal(false); return; }
  col = dbx.collection('data/users/' + uid);
  let first = true;
  const slow = setTimeout(() => { if (first) { S.mode = 'db'; S.syncSlow = true; refresh(); } }, 10000);
  col.onSnapshot((snap) => {
    const map = {}; snap.docs.forEach((d) => { const v = d.data(); if (v) map[d.id] = clone(v); });
    applyDocs(map);
    if (!snap.metadata.fromCache) { clearTimeout(slow); S.syncSlow = false; }
    const wasLoading = S.mode === 'loading';
    S.mode = 'db';
