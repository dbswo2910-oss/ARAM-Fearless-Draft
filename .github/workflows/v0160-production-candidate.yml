name: v0.16.0 Production Candidate Gate

on:
  push:
    branches: [ release/v0160-production-candidate ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify explicit final approval metadata
        run: node -e "const x=require('./release/v0.16.0-final-approval.json'); if(!x.approval?.final_production_release_approved) process.exit(1); console.log('FINAL APPROVAL: PRESENT')"
      - name: Enforce real canonical production runtime integration
        run: node tools/stability/production-runtime-integration-audit.js
      - name: Upload production integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-production-runtime-integration
          path: audit-output/stability/production-runtime-integration-report.json
          if-no-files-found: warn
