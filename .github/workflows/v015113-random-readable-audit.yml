name: v0.15.113 RANDOM Readable Workspace Audit

on:
  pull_request:
    paths:
      - 'update/v0.15.113/**'
      - 'tools/v015113-random-readable-audit.js'
      - '.github/workflows/v015113-random-readable-audit.yml'
      - '.github/workflows/v015113-activate-random-readable.yml'
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.113/**'
      - 'tools/v015113-random-readable-audit.js'
      - '.github/workflows/v015113-random-readable-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.113 RANDOM readable workspace audit
        run: node tools/v015113-random-readable-audit.js
      - name: Run v0.15.112 workspace stability audit
        run: node tools/v015112-random-workspace-stability-audit.js
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015113-random-readable-audit
          path: audit-output/v015113-random-readable-report.json
          if-no-files-found: ignore
