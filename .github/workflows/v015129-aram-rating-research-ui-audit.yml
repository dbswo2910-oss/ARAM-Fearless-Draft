name: v0.15.129 Historical ARAM Rating Research UI Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current continuity
        run: |
          node tools/sync-current-state.js --check
          node tools/ai-continuity-audit.js
      - name: Preserve historical v0.15.129 audit sources without asserting the active manifest
        run: |
          node -c tools/v015129-aram-rating-research-ui-audit.js
          node -c tools/v015129-history-preservation-audit.js
          echo 'Historical exact-version audit is manual-only because v0.15.129 is no longer the active distribution.'
