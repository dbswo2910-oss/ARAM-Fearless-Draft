name: v0.15.129 ARAM Rating Research UI Audit

on:
  push:
    branches: [ feat/v015129-aram-rating-research-ui ]
    paths:
      - 'update/v0.15.129/**'
      - 'update/manifest.json'
      - 'update/current-state.json'
      - 'docs/CURRENT_STATE.md'
      - 'tools/v015129-aram-rating-research-ui-audit.js'
      - 'tools/v015129-history-preservation-audit.js'
      - '.github/workflows/v015129-aram-rating-research-ui-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'update/v0.15.129/**'
      - 'update/manifest.json'
      - 'update/current-state.json'
      - 'docs/CURRENT_STATE.md'
      - 'tools/v015129-aram-rating-research-ui-audit.js'
      - 'tools/v015129-history-preservation-audit.js'
      - '.github/workflows/v015129-aram-rating-research-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile v0.15.129 package
        run: |
          node -c update/v0.15.129/rating-engine-v01.js
          node -c update/v0.15.129/research-ui-core.js
          node -c update/v0.15.129/research-ui-devtools.js
          node -c update/v0.15.129/runtime-source-stability-v015129.js
          node -c update/v0.15.129/main-v015129.js
          node -c update/v0.15.129/successor-route-v015129.js
          node -c tools/v015129-aram-rating-research-ui-audit.js
          node -c tools/v015129-history-preservation-audit.js
      - name: Run v0.15.129 Research UI fixtures and integration audit
        run: node tools/v015129-aram-rating-research-ui-audit.js
      - name: Run Full Regression
        run: node tools/full-regression-audit.js
      - name: Run Player Profile regression
        run: node tools/profile-ux-audit.js
      - name: Run Match History regression
        run: node tools/v015129-history-preservation-audit.js
      - name: Run AutoSync regression
        run: node tools/v015119-autosync-concurrency-audit.js
      - name: Run RANDOM regression
        run: node tools/v015121-random-practice-restore-audit.js
      - name: Run DATA regression
        run: node tools/v015120-data-subnav-audit.js
      - name: Run Item regression
        run: node tools/item-recommendation-v01581-audit.js
      - name: Run update and ownership safety
        run: |
          node tools/v015115-single-owner-stability-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015118-resource-lifecycle-audit.js
      - name: Verify AI continuity snapshot
        run: node tools/sync-current-state.js --check
      - name: Run AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload v0.15.129 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015129-aram-rating-research-ui-audit
          path: |
            audit-output/v015129-aram-rating-research-ui-report.json
            audit-output/full-regression-report.json
            audit-output/profile-ux-report.json
            audit-output/v015119-autosync-concurrency-report.json
            audit-output/v015121-random-practice-restore-report.json
            audit-output/v015120-data-subnav-report.json
            audit-output/v015116-runtime-update-stability-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: warn
