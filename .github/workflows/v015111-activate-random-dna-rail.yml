name: v0.15.111 Activate RANDOM DNA Rail

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015111-activate-random-dna-rail.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015111-random-dna-rail-audit.js
          node tools/v015110-patch-notes-density-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.111 manifest + docs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          m.version='0.15.111';
          m.message='v0.15.111 · RANDOM DNA RAIL — readable selected-composition detail + DNA layout';
          const remove=new Set(['random-dna-rail-v015111.js','runtime-source-stability-v015111.js','main-v015111.js']);
          m.files=(m.files||[]).filter(x=>!remove.has(x.path));
          const pkg=m.files.find(x=>x.path==='package.json');
          if(!pkg)throw new Error('manifest package.json missing');
          pkg.source='update/v0.15.111/package.json';
          let idx=m.files.findIndex(x=>x.path==='patch-notes-density-v015110.js');
          if(idx<0)throw new Error('v0.15.110 UI anchor missing');
          m.files.splice(idx+1,0,{path:'random-dna-rail-v015111.js',source:'update/v0.15.111/random-dna-rail-v015111.js'});
          idx=m.files.findIndex(x=>x.path==='runtime-source-stability-v015110.js');
          if(idx<0)throw new Error('v0.15.110 runtime anchor missing');
          m.files.splice(idx+1,0,{path:'runtime-source-stability-v015111.js',source:'update/v0.15.111/runtime-source-stability-v015111.js'});
          idx=m.files.findIndex(x=>x.path==='main-v015110.js');
          if(idx<0)throw new Error('v0.15.110 main anchor missing');
          m.files.splice(idx+1,0,{path:'main-v015111.js',source:'update/v0.15.111/main-v015111.js'});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';
          let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.111**');
          const note='- **v0.15.111**: RANDOM right-rail repair. Selected-composition detail and Combination DNA no longer collapse into unreadable narrow columns; scoring remains unchanged.';
          if(!r.includes('**v0.15.111**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.111**');
          const hnote='\n### v0.15.111 — RANDOM DNA right-rail repair\n\nScreenshot-confirmed fix for the selected-composition detail + Combination DNA rail being squeezed into tiny side-by-side columns. The rail now uses width-aware `auto-fit/minmax(260px, 1fr)` so a narrow third column stacks vertically while a genuinely wide row can use two columns. Korean detail text wrapping is restored. Recommendation/scoring/item logic is unchanged and v0.15.79 safety lineage is preserved. `score_logic_changed:false`.\n';
          if(!h.includes('### v0.15.111 — RANDOM DNA right-rail repair'))h+=hnote;
          fs.writeFileSync(hp,h);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015111-random-dna-rail-audit.js
          node tools/v015110-patch-notes-density-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.111 random dna rail'
            git push
          fi
