name: Full Regression Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-report
          path: audit-output/full-regression-report.json
          if-no-files-found: error
