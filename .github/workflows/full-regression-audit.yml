name: Full Regression Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Run Community Calibration audit
        run: node tools/community-calibration-audit.js
      - name: Run Profile UX audit
        run: node tools/profile-ux-audit.js
      - name: Run Draft v0.15.40 audit
        run: node tools/draft-v01540-audit.js
      - name: Run Builder Pool v0.15.41 audit
        run: node tools/builder-pool-v01541-audit.js
      - name: Run Draft Live Context v0.15.42 audit
        run: node tools/draft-v01542-audit.js
      - name: Run Draft Balance + Alerts v0.15.43 audit
        run: node tools/draft-v01543-audit.js
      - name: Run Stable Draft Layout v0.15.45 audit
        run: node tools/draft-v01545-audit.js
      - name: Run Pick Judgment Risk Board v0.15.46 audit
        run: node tools/draft-v01546-audit.js
      - name: Run Judgment Tabs + Counter v0.15.47 audit
        run: node tools/draft-v01547-audit.js
      - name: Run Random Practice Exact-DOM UI v0.15.49 audit
        run: node tools/random-practice-v01549-audit.js
      - name: Run Random Practice Pick Density v0.15.55 audit
        run: node tools/random-pick-v01555-audit.js
      - name: Run Random Practice party picks v0.15.58 audit
        run: node tools/random-party-picks-v01558-audit.js
      - name: Run Random Practice party labels v0.15.59 audit
        run: node tools/random-party-labels-v01559-audit.js
      - name: Run v0.15.60 party-label + latest item-art audit
        run: node tools/v01560-audit.js
      - name: Run v0.15.61 robust party-label audit
        run: node tools/v01561-audit.js
      - name: Run v0.15.62 pool team-pick label audit
        run: node tools/v01562-audit.js
      - name: Run v0.15.63 Randuin + Thornmail current-art audit
        run: node tools/v01563-audit.js
      - name: Run v0.15.64 unified current item-art coverage audit
        run: node tools/item-art-v01564-audit.js
      - name: Run v0.15.65 no-flicker item-art owner audit
        run: node tools/item-art-v01565-audit.js
      - name: Run v0.15.66 startup responsiveness audit
        run: node tools/runtime-stability-v01566-audit.js
      - name: Run Random In-game Coach + Preview v0.15.50 audit
        run: node tools/random-ingame-v01550-audit.js
      - name: Run Random In-game HUD hierarchy v0.15.51 audit
        run: node tools/random-ingame-v01551-audit.js
      - name: Run Random In-game HUD micro-polish v0.15.52 audit
        run: node tools/random-ingame-v01552-audit.js
      - name: Run Random In-game death shop planner v0.15.53 audit
        run: node tools/random-ingame-v01553-audit.js
      - name: Run Random In-game shop screenshot polish v0.15.54 audit
        run: node tools/random-ingame-v01554-audit.js
      - name: Run Random item icons v0.15.56 audit
        run: node tools/random-item-icons-v01556-audit.js
      - name: Run Global item icons v0.15.57 audit
        run: node tools/item-icons-v01557-audit.js
      - name: Assemble current updater overlay
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const m=JSON.parse(fs.readFileSync('update/manifest.json','utf8'));
          fs.rmSync('audit-output/current-overlay',{recursive:true,force:true});
          for(const f of m.files){
            const dst=path.join('audit-output/current-overlay',f.path);
            fs.mkdirSync(path.dirname(dst),{recursive:true});
            fs.copyFileSync(f.source,dst);
          }
          fs.writeFileSync('audit-output/current-overlay/_manifest.json',JSON.stringify(m,null,2));
          NODE
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-report
          path: |
            audit-output/full-regression-report.json
            audit-output/community-calibration-report.json
            audit-output/profile-ux-report.json
            audit-output/draft-v01540-report.json
            audit-output/builder-pool-v01541-report.json
            audit-output/draft-v01542-report.json
            audit-output/draft-v01543-report.json
            audit-output/draft-v01545-report.json
            audit-output/draft-v01546-report.json
            audit-output/draft-v01547-report.json
            audit-output/random-practice-v01549-report.json
            audit-output/random-pick-v01555-report.json
            audit-output/random-party-picks-v01558-report.json
            audit-output/random-party-labels-v01559-report.json
            audit-output/v01560-report.json
            audit-output/v01561-report.json
            audit-output/v01562-report.json
            audit-output/v01563-report.json
            audit-output/item-art-v01564-report.json
            audit-output/item-art-v01565-report.json
            audit-output/runtime-stability-v01566-report.json
            audit-output/random-ingame-v01550-report.json
            audit-output/random-ingame-v01551-report.json
            audit-output/random-ingame-v01552-report.json
            audit-output/random-ingame-v01553-report.json
            audit-output/random-ingame-v01554-report.json
            audit-output/random-item-icons-v01556-report.json
            audit-output/item-icons-v01557-report.json
          if-no-files-found: error
      - name: Upload current runtime overlay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-runtime-overlay
          path: audit-output/current-overlay
          if-no-files-found: error
