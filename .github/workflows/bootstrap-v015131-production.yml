name: Bootstrap v0.15.131 Production

on:
  push:
    branches: [ release/v0.15.131-research-storage-patchnotes ]
    paths: [ '.github/workflows/bootstrap-v015131-production.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.15.131-research-storage-patchnotes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build v0.15.131 successor package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, shutil
          root=Path('.')
          src=root/'update/v0.15.130'; dst=root/'update/v0.15.131'
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True)
          for name in ['rating-engine-v01.js','research-ui-core.js','research-ui-devtools.js','ARAM_Fearless_Draft_Launcher_windows_x64.exe']:
              shutil.copy2(src/name,dst/name)

          # Engine is deliberately byte-identical. UI core only changes unavailable-state copy.
          core=(dst/'research-ui-core.js').read_text(encoding='utf-8')
          old="if(vm.kind==='unavailable')return shell('',`<div class=\"arui-empty\">Research data unavailable<small>연구 데이터 로드에 실패했습니다. 기존 전적검색에는 영향을 주지 않습니다.</small></div>`);"
          new="if(vm.kind==='unavailable'){const copies={loading:['연구 데이터 불러오는 중','기존 연구 데이터를 확인하고 있습니다.'],database_unavailable:['연구 데이터 저장소를 열 수 없음','기존 전적검색에는 영향이 없습니다. 진단 로그에서 실패 단계를 확인할 수 있습니다.'],checkpoint_missing:['기존 연구 데이터가 보이지 않음','저장된 연구 체크포인트를 찾지 못했습니다. 데이터를 초기화하거나 다시 수집하지 않습니다.'],dataset_empty:['분석할 연구 데이터 없음','저장소는 열렸지만 분석할 경기가 없습니다.'],player_not_found:['분석 데이터 없음','이 플레이어는 아직 분석 데이터에 포함되지 않았습니다.']};const c=copies[vm.state]||copies.database_unavailable;return shell('',`<div class=\"arui-empty\"><b>${esc(c[0])}</b><small>${esc(c[1])}</small></div>`)};"
          assert old in core, 'v130 unavailable render contract not found'
          core=core.replace(old,new,1)
          (dst/'research-ui-core.js').write_text(core,encoding='utf-8')

          storage=r'''\'use strict\';
(function(root,factory){const api=factory();if(typeof module===\'object\'&&module.exports)module.exports=api;if(root)root.ARAMRatingResearchStorageV015131=api})(typeof globalThis!==\'undefined\'?globalThis:this,function(){
  const DB_NAME=\'aram-rating-research-v03\',STORE=\'kv\',CHECKPOINT_KEY=\'checkpoint-v03\',LATEST_RUN_KEY=\'rating-ui-latest-run-v01\';
  const asArray=x=>Array.isArray(x)?x:[];
  function checkpointStamp(cp){const xs=asArray(cp?.matches),last=xs.at(-1),id=last?.gameId??last?.id??last?.matchId??\'\';return[cp?.seed_fingerprint||\'\',cp?.phase||\'\',cp?.status||\'\',cp?.sampling_version||cp?.config?.samplingVersion||\'\',xs.length,cp?.finished_at_v031||cp?.finished_at||\'\',id].join(\'|\')}
  function sourceMeta(cp){return{phase:String(cp?.phase||\'UNKNOWN\'),status:String(cp?.status||\'unknown\'),sampling_version:String(cp?.sampling_version||cp?.config?.samplingVersion||\'v0.3\'),source:`IndexedDB ${DB_NAME}/${CHECKPOINT_KEY}`}}
  async function databaseExists(idb,name){if(typeof idb?.databases!==\'function\')return null;try{const xs=await idb.databases();return xs.some(x=>x?.name===name)}catch{return null}}
  async function openExistingDatabase(idb,name=DB_NAME){
    if(!idb?.open)throw Object.assign(new Error(\'indexedDB_unavailable\'),{stage:\'indexeddb_open\'});
    const known=await databaseExists(idb,name);if(known===false)return{db:null,missing:true,created:false};
    return new Promise((resolve,reject)=>{let created=false;const req=idb.open(name);req.onupgradeneeded=e=>{if(Number(e.oldVersion||0)===0){created=true;try{req.transaction.abort()}catch{}}};req.onsuccess=()=>resolve({db:req.result,missing:false,created:false});req.onerror=()=>{if(created&&req.error?.name===\'AbortError\')resolve({db:null,missing:true,created:true});else reject(Object.assign(req.error||new Error(\'indexeddb_open_failed\'),{stage:\'indexeddb_open\'}))};req.onblocked=()=>reject(Object.assign(new Error(\'indexeddb_open_blocked\'),{stage:\'indexeddb_open\'}))})
  }
  function readKey(db,store,key){return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(store,\'readonly\')}catch(e){reject(Object.assign(e,{stage:\'schema_check\'}));return}const req=tx.objectStore(store).get(key);req.onsuccess=()=>resolve(req.result??null);req.onerror=()=>reject(Object.assign(req.error||new Error(\'indexeddb_read_failed\'),{stage:`read:${key}`}))})}
  function countRatings(run){return Object.values(run?.players||{}).filter(p=>p?.models&&Object.keys(p.models).length>0).length}
  function selectRun(checkpoint,stored,opts={}){
    const matches=asArray(checkpoint?.matches);if(!checkpoint)return{state:\'checkpoint_missing\',run:null,source:\'none\'};if(matches.length===0)return{state:\'dataset_empty\',run:null,source:\'checkpoint\'};
    const stamp=(opts.checkpointStamp||checkpointStamp)(checkpoint);
    if(!opts.forceBuild&&stored?.schema===\'aram-rating-ui-latest-run-v01\'&&stored?.source_run?.checkpoint_stamp===stamp)return{state:\'available\',run:stored,source:\'derived_cache\'};
    const engine=opts.engine;if(!engine?.buildLatestRun)throw Object.assign(new Error(\'rating_engine_unavailable\'),{stage:\'rating_engine_init\'});
    const run=engine.buildLatestRun(matches,(opts.sourceMeta||sourceMeta)(checkpoint));run.source_run={checkpoint_key:CHECKPOINT_KEY,checkpoint_stamp:stamp,checkpoint_finished_at:checkpoint.finished_at_v031||checkpoint.finished_at||null,checkpoint_status:checkpoint.status||null,checkpoint_phase:checkpoint.phase||null};return{state:\'available\',run,source:\'checkpoint_rebuild_memory\'}
  }
  async function loadExisting(opts={}){
    const diag={db_name:DB_NAME,indexeddb_open:false,db_version:null,object_stores:[],checkpoint_found:false,match_count:0,player_count:0,rating_state_count:0,cache_status:\'not_checked\',source:\'none\',error_stage:\'\',error_name:\'\',error_message:\'\'};let db=null;
    try{
      const opened=await openExistingDatabase(opts.indexedDBRef||globalThis.indexedDB,DB_NAME);if(opened.missing)return{state:\'checkpoint_missing\',run:null,diagnostic:diag};db=opened.db;diag.indexeddb_open=true;diag.db_version=db.version;diag.object_stores=Array.from(db.objectStoreNames||[]);if(!diag.object_stores.includes(STORE))throw Object.assign(new Error(`object_store_missing:${STORE}`),{stage:\'schema_check\'});
      const cp=await readKey(db,STORE,CHECKPOINT_KEY);diag.checkpoint_found=!!cp;diag.match_count=asArray(cp?.matches).length;if(!cp)return{state:\'checkpoint_missing\',run:null,diagnostic:diag};if(diag.match_count===0)return{state:\'dataset_empty\',run:null,diagnostic:diag};
      let stored=null;try{stored=await readKey(db,STORE,LATEST_RUN_KEY);diag.cache_status=stored?\'read\':\'missing\'}catch(e){diag.cache_status=`ignored_read_error:${e?.name||\'Error\'}`}
      const selected=selectRun(cp,stored,{engine:opts.engine,forceBuild:opts.forceBuild,checkpointStamp:opts.checkpointStamp,sourceMeta:opts.sourceMeta});diag.source=selected.source;diag.player_count=Number(selected.run?.dataset?.players)||Object.keys(selected.run?.players||{}).length;diag.rating_state_count=countRatings(selected.run);return{state:selected.state,run:selected.run,diagnostic:diag};
    }catch(e){diag.error_stage=e?.stage||\'load\';diag.error_name=e?.name||\'Error\';diag.error_message=e?.message||String(e);return{state:\'database_unavailable\',run:null,diagnostic:diag,error:e}}finally{try{db?.close?.()}catch{}}
  }
  return{DB_NAME,STORE,CHECKPOINT_KEY,LATEST_RUN_KEY,checkpointStamp,sourceMeta,databaseExists,openExistingDatabase,readKey,selectRun,loadExisting,policy_version:\'0.15.131\',read_only_boot:true,destructive_migration:false};
});
'''
          (dst/'research-storage-v015131.js').write_text(storage,encoding='utf-8')

          ui=(dst/'research-ui-devtools.js').read_text(encoding='utf-8')
          ui=ui.replace("const VERSION='aram-rating-ui-v015130-production-target-puuid'","const VERSION='aram-rating-ui-v015131-production-storage-recovery'",1)
          ui=ui.replace("let disposed=false,observer=null,observedNode=null,mountQueued=false,mounting=false,latestRun=null,lastError=null,booting=true,lastIdentityKey='',lastDiagnostic=null;","let disposed=false,observer=null,observedNode=null,mountQueued=false,mounting=false,latestRun=null,lastError=null,booting=true,lastIdentityKey='',lastDiagnostic=null,bootState='loading',lastBootLogKey='',bootDiagnostic={db_name:DB_NAME,indexeddb_open:false,db_version:null,object_stores:[],checkpoint_found:false,match_count:0,player_count:0,rating_state_count:0,identity_resolved:'(none)',render_status:'loading',error_stage:'',error_name:'',error_message:'',renderer_origin:String(location?.origin||''),renderer_protocol:String(location?.protocol||''),renderer_entry:String(location?.pathname||'').split('/').pop()||''};",1)
          a=ui.index("  function dbOpen()") ; b=ui.index("  async function ensureModules()",a); assert a>=0 and b>a
          ui=ui[:a]+ui[b:]
          ui=ui.replace("async function ensureModules(){if(!globalThis.ARAMRatingResearchEngineV01)throw new Error('ARAMRatingResearchEngineV01 bundled module unavailable');if(!globalThis.ARAMRatingResearchUICoreV01)throw new Error('ARAMRatingResearchUICoreV01 bundled module unavailable');return{E:globalThis.ARAMRatingResearchEngineV01,U:globalThis.ARAMRatingResearchUICoreV01}}","async function ensureModules(){if(!globalThis.ARAMRatingResearchEngineV01)throw Object.assign(new Error('ARAMRatingResearchEngineV01 bundled module unavailable'),{stage:'rating_engine_init'});if(!globalThis.ARAMRatingResearchUICoreV01)throw Object.assign(new Error('ARAMRatingResearchUICoreV01 bundled module unavailable'),{stage:'ui_core_init'});if(!globalThis.ARAMRatingResearchStorageV015131)throw Object.assign(new Error('ARAMRatingResearchStorageV015131 bundled module unavailable'),{stage:'storage_module_init'});return{E:globalThis.ARAMRatingResearchEngineV01,U:globalThis.ARAMRatingResearchUICoreV01,S:globalThis.ARAMRatingResearchStorageV015131}}",1)
          a=ui.index("  async function buildAndStoreLatest") ; b=ui.index("  function state()",a); assert a>=0 and b>a
          block=r'''  async function synchronizeLatestRun(opts={}){const{E,S}=await ensureModules();bootState='loading';bootDiagnostic.render_status='loading';bootDiagnostic.error_stage='';bootDiagnostic.error_name='';bootDiagnostic.error_message='';const out=await S.loadExisting({indexedDBRef:indexedDB,engine:E,forceBuild:!!opts.forceBuild,checkpointStamp,sourceMeta});bootState=out.state||'database_unavailable';Object.assign(bootDiagnostic,out.diagnostic||{});latestRun=out.run||null;if(out.error){lastError=String(out.error?.message||out.error);bootDiagnostic.error_stage=out.diagnostic?.error_stage||out.error?.stage||'load';bootDiagnostic.error_name=out.error?.name||'Error';bootDiagnostic.error_message=lastError}else lastError=null;return latestRun}
'''
          ui=ui[:a]+block+ui[b:]
          marker="  function css(){"
          logfn=r'''  function emitBootDiagnostic(r=null,force=false){const U=globalThis.ARAMRatingResearchUICoreV01;if(r)bootDiagnostic.identity_resolved=U?.maskPuuid?.(r.puuid)||'(none)';const d=bootDiagnostic,k=JSON.stringify([bootState,d.indexeddb_open,d.db_version,d.checkpoint_found,d.match_count,d.player_count,d.rating_state_count,d.identity_resolved,d.render_status,d.error_stage,d.error_name,d.error_message]);if(!force&&k===lastBootLogKey)return d;lastBootLogKey=k;console.log(`[ARAM Rating Research boot]\nDB name: ${DB_NAME}\nIndexedDB open: ${d.indexeddb_open}\nDB version: ${d.db_version??'(unknown)'}\nobject stores: ${(d.object_stores||[]).join(', ')||'(none)'}\ncheckpoint-v03 found: ${d.checkpoint_found}\nmatch count: ${d.match_count||0}\nplayer count: ${d.player_count||0}\nrating state count: ${d.rating_state_count||0}\nidentity resolved: ${d.identity_resolved||'(none)'}\nrender status: ${d.render_status||bootState}\nerror stage: ${d.error_stage||'(none)'}\nerror name: ${d.error_name||'(none)'}\nerror message: ${d.error_message||'(none)'}`);return d}
'''
          assert marker in ui; ui=ui.replace(marker,logfn+marker,1)
          oldmount="let vm;if(lastError&&!latestRun)vm={kind:'unavailable',message:lastError};else if(!latestRun)vm={kind:'unavailable',message:'Research data unavailable'};else vm=U?.buildViewModel(latestRun,r.puuid,{hardCap:HARD_CAP})||{kind:'unavailable'};"
          newmount="let vm;if(!latestRun)vm={kind:'unavailable',state:bootState,message:lastError||bootState};else vm=U?.buildViewModel(latestRun,r.puuid,{hardCap:HARD_CAP})||{kind:'unavailable',state:'database_unavailable'};if(vm?.kind==='no_data')bootState='player_not_found';else if(vm?.kind==='player')bootState=vm.sample?.key==='insufficient'?'insufficient_sample':'available';bootDiagnostic.identity_resolved=U?.maskPuuid?.(r.puuid)||'(none)';bootDiagnostic.render_status=bootState;"
          assert oldmount in ui; ui=ui.replace(oldmount,newmount,1)
          ui=ui.replace("lastIdentityKey=key;emitDiagnostic(r);ensureProfileObserver();return true","lastIdentityKey=key;emitDiagnostic(r);emitBootDiagnostic(r);ensureProfileObserver();return true",1)
          a=ui.index("  async function refreshLocal()") ; b=ui.index("  function onClick",a); assert a>=0 and b>a
          refresh=r'''  async function refreshLocal(){const btn=document.querySelector('#aramRatingResearchCardV01 [data-arui-action="refresh"]');if(btn)btn.disabled=true;try{await ensureModules();await synchronizeLatestRun({forceBuild:true});lastIdentityKey='';mount();return{status:latestRun?'ok':bootState,dataset:latestRun?.dataset||null,selection:latestRun?.selection||null}}catch(e){lastError=String(e?.message||e);bootState='database_unavailable';bootDiagnostic.error_stage=e?.stage||'refresh';bootDiagnostic.error_name=e?.name||'Error';bootDiagnostic.error_message=lastError;console.warn('[ARAM Rating Research UI] local refresh unavailable',e);mount();emitBootDiagnostic(null,true);return{status:'unavailable',error:lastError}}finally{const b=document.querySelector('#aramRatingResearchCardV01 [data-arui-action="refresh"]');if(b)b.disabled=false}}
'''
          ui=ui[:a]+refresh+ui[b:]
          ui=ui.replace("status:()=>({enabled:enabled()&&!disposed,booting,latest_run:!!latestRun,last_error:lastError,dataset:latestRun?.dataset||null,selection:latestRun?.selection||null,identity:lastDiagnostic})","status:()=>({enabled:enabled()&&!disposed,booting,boot_state:bootState,boot_diagnostic:bootDiagnostic,latest_run:!!latestRun,last_error:lastError,dataset:latestRun?.dataset||null,selection:latestRun?.selection||null,identity:lastDiagnostic}),debugBoot:()=>emitBootDiagnostic(resolution(),true)",1)
          oldboot="(async()=>{try{await ensureModules();if(enabled()){await synchronizeLatestRun();lastError=null}else lastError='Research UI disabled by local feature flag'}catch(e){lastError=String(e?.message||e);console.warn('[ARAM Rating Research UI] unavailable; production match history/profile is unchanged',e)}finally{booting=false;try{ensureProfileObserver();mount()}catch{}window.__ARAM_RATING_RESEARCH_UI_V01__=!!enabled()}})();"
          newboot="(async()=>{try{bootState='loading';bootDiagnostic.error_stage='module_init';await ensureModules();if(enabled()){await synchronizeLatestRun()}else{lastError='Research UI disabled by local feature flag';bootState='database_unavailable'}}catch(e){lastError=String(e?.message||e);bootState='database_unavailable';bootDiagnostic.error_stage=e?.stage||bootDiagnostic.error_stage||'boot';bootDiagnostic.error_name=e?.name||'Error';bootDiagnostic.error_message=lastError;console.warn('[ARAM Rating Research UI] unavailable; production match history/profile is unchanged',e)}finally{booting=false;try{ensureProfileObserver();mount()}catch(e){bootDiagnostic.render_status='render_failed';bootDiagnostic.error_stage='render';bootDiagnostic.error_name=e?.name||'Error';bootDiagnostic.error_message=e?.message||String(e)}emitBootDiagnostic(null,true);window.__ARAM_RATING_RESEARCH_UI_V01__=!!enabled()}})();"
          assert oldboot in ui; ui=ui.replace(oldboot,newboot,1)
          (dst/'research-ui-devtools.js').write_text(ui,encoding='utf-8')

          # Existing DATA owner fix: patch-note detail is always open and its generic champion-detail header is suppressed only in patch mode.
          data_src=(root/'update/v0.15.120/ui-stability-baseline-v015115.js').read_text(encoding='utf-8')
          data_src=data_src.replace("const PRESENTATION='0.15.120';","const PRESENTATION='0.15.131';",1)
          css_anchor='      @media(max-width:1180px){'
          css_patch='''      /* v0.15.131: Patch Notes owns the full detail branch. Hide the generic champion-detail title/close row only while Patch Notes is active. */\n      #data.data115View.data115PatchMode .data115DetailBranch > .title,\n      #data.data115View.data115PatchMode .data115DetailBranch > .panel > .title{display:none!important}\n\n'''
          assert css_anchor in data_src; data_src=data_src.replace(css_anchor,css_patch+css_anchor,1)
          mode_anchor="    const mode=requested==='patch'||requested==='tier'?requested:currentDataMode(p.card);"
          mode_patch=mode_anchor+"\n    const patchMode=mode==='patch';\n    if(patchMode){for(const el of [p.detailBranch,p.card]){el.hidden=false;el.removeAttribute('aria-hidden');el.classList.remove('hidden','collapsed','is-collapsed');el.style?.removeProperty?.('display');el.style?.removeProperty?.('visibility');el.style?.removeProperty?.('max-height')}}"
          assert mode_anchor in data_src; data_src=data_src.replace(mode_anchor,mode_patch,1)
          title_old="    if(title){\n      if(!title.dataset.data115Original)title.dataset.data115Original=text(title)||'챔피언 상세';\n      title.textContent=mode==='patch'?'패치노트':title.dataset.data115Original;\n    }"
          title_new="    if(title){\n      if(!title.dataset.data115Original)title.dataset.data115Original=text(title)||'챔피언 상세';\n      title.hidden=patchMode;\n      if(patchMode){title.setAttribute('aria-hidden','true')}else{title.removeAttribute('aria-hidden');title.textContent=title.dataset.data115Original}\n    }"
          assert title_old in data_src; data_src=data_src.replace(title_old,title_new,1)
          click_anchor="  document.addEventListener('click',e=>{\n    if(e.target?.closest?.('#randomPickModeBtn,#randomIngameModeBtn'))queueMicrotask(claimRandom);\n  },false);"
          click_new="  document.addEventListener('click',e=>{\n    if(e.target?.closest?.('#randomPickModeBtn,#randomIngameModeBtn'))queueMicrotask(claimRandom);\n  },false);\n\n  document.addEventListener('click',e=>{\n    const view=$('#data');if(!view?.classList.contains('data115PatchMode'))return;\n    const p=dataParts(),btn=e.target?.closest?.('button');if(!p||!btn||!p.detailBranch.contains(btn)||!/닫기/.test(text(btn)))return;\n    e.preventDefault();e.stopImmediatePropagation();syncData('patch');\n  },true);"
          assert click_anchor in data_src; data_src=data_src.replace(click_anchor,click_new,1)
          (dst/'ui-stability-baseline-v015115.js').write_text(data_src,encoding='utf-8')

          runtime=(src/'runtime-source-stability-v015130.js').read_text(encoding='utf-8').replace('V015130','V015131').replace('v0.15.130','v0.15.131').replace("'0.15.130'","'0.15.131'")
          runtime=runtime.replace("  const ui=readLocal('research-ui-devtools.js');","  const storage=readLocal('research-storage-v015131.js');\n  const ui=readLocal('research-ui-devtools.js');",1)
          runtime=runtime.replace("  if(!ui.includes('aramRatingResearchUIV01'))throw new Error('v0.15.131 research UI runtime contract mismatch');","  if(!storage.includes('ARAMRatingResearchStorageV015131'))throw new Error('v0.15.131 research storage contract mismatch');\n  if(!ui.includes('aramRatingResearchUIV01'))throw new Error('v0.15.131 research UI runtime contract mismatch');",1)
          runtime=runtime.replace("cached=[engine,core,ui].join('\\n;\\n');","cached=[engine,core,storage,ui].join('\\n;\\n');",1)
          runtime=runtime.replace("  aram_rating_search_target_rerender:true,","  aram_rating_search_target_rerender:true,\n  aram_rating_storage_read_only_recovery:true,\n  aram_rating_checkpoint_preserved:true,\n  patch_notes_detail_header_removed:true,",1)
          (dst/'runtime-source-stability-v015131.js').write_text(runtime,encoding='utf-8')

          main=(src/'main-v015130.js').read_text(encoding='utf-8').replace('v015130','v015131').replace('V015130','V015131').replace('0.15.130','0.15.131')
          (dst/'main-v015131.js').write_text(main,encoding='utf-8')
          route=(src/'successor-route-v015130.js').read_text(encoding='utf-8').replace('v015130','v015131').replace('0.15.130','0.15.131')
          (dst/'successor-route-v015131.js').write_text(route,encoding='utf-8')
          cold=(src/'cold-start-promotion-v015130.js').read_text(encoding='utf-8').replace('v015130','v015131').replace('0.15.130','0.15.131').replace('promotion-v015130.json','promotion-v015131.json')
          (dst/'cold-start-promotion-v015131.js').write_text(cold,encoding='utf-8')
          pkg={'name':'aram-fearless-draft-update','version':'0.15.131','description':'Upgrade package v0.15.131 - Research IndexedDB recovery + always-visible Patch Notes detail','main':'main-v015131.js'}
          (dst/'package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Manifest stays bootstrap-compatible with v0.15.129/v0.15.130 launcher 2.0.2.
          mp=root/'update/manifest.json'; manifest=json.loads(mp.read_text(encoding='utf-8'))
          manifest['version']='0.15.131';manifest['message']='v0.15.131 · RESEARCH STORAGE RECOVERY + PATCH NOTES DETAIL FIX';manifest['min_launcher']='2.0.2'
          sources={
            'package.json':'update/v0.15.131/package.json',
            'rating-engine-v01.js':'update/v0.15.131/rating-engine-v01.js',
            'research-ui-core.js':'update/v0.15.131/research-ui-core.js',
            'research-ui-devtools.js':'update/v0.15.131/research-ui-devtools.js',
            'ui-stability-baseline-v015115.js':'update/v0.15.131/ui-stability-baseline-v015115.js',
            'ARAM_Fearless_Draft_Launcher_windows_x64.exe':'update/v0.15.131/ARAM_Fearless_Draft_Launcher_windows_x64.exe'
          }
          additions={
            'research-storage-v015131.js':'update/v0.15.131/research-storage-v015131.js',
            'runtime-source-stability-v015131.js':'update/v0.15.131/runtime-source-stability-v015131.js',
            'main-v015131.js':'update/v0.15.131/main-v015131.js',
            'successor-route-v015131.js':'update/v0.15.131/successor-route-v015131.js',
            'cold-start-promotion-v015131.js':'update/v0.15.131/cold-start-promotion-v015131.js'
          }
          by={f['path']:f for f in manifest['files']}
          for target,source in {**sources,**additions}.items():
              entry=by.get(target)
              if entry is None:
                  entry={'path':target};manifest['files'].append(entry);by[target]=entry
              entry['source']=source
              entry['sha256']=hashlib.sha256((root/source).read_bytes()).hexdigest()
