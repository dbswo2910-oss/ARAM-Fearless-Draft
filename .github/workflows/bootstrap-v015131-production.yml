name: Bootstrap v0.15.131 Production

on:
  push:
    branches:
      - release/v0.15.131-research-storage-patchnotes
    paths:
      - .github/workflows/bootstrap-v015131-production.yml
      - tools/build-v015131.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.15.131-research-storage-patchnotes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate v0.15.131
        run: python tools/build-v015131.py
      - name: Sync continuity metadata
        run: node tools/sync-current-state.js
      - name: Validate generated release
        run: |
          node -c update/v0.15.131/research-storage-v015131.js
          node -c update/v0.15.131/research-ui-devtools.js
          node -c update/v0.15.131/ui-stability-baseline-v015115.js
          node tools/v015131-production-audit.js
      - name: Commit generated release
        run: |
          rm .github/workflows/bootstrap-v015131-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/v0.15.131 update/manifest.json update/current-state.json docs/CURRENT_STATE.md tools/v015131-production-audit.js tools/v015131-history-preservation-audit.js .github/workflows/v015131-production-audit.yml .github/workflows/bootstrap-v015131-production.yml
          git commit -m 'release: v0.15.131 recover Research DB and keep Patch Notes detail open [v015131-generated]'
          git push origin HEAD:release/v0.15.131-research-storage-patchnotes
