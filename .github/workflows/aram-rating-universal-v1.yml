name: ARAM Rating Universal V1

on:
  push:
    branches:
      - feature/universal-player-rating-v1
  pull_request:
    paths:
      - 'src/rating/universal/**'
      - 'test/universal-rating-v1.test.js'
      - '.github/workflows/aram-rating-universal-v1.yml'
      - 'update/v0.15.129/rating-engine-v01.js'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/rating/universal/contracts.js
          node --check src/rating/universal/normalizer.js
          node --check src/rating/universal/store.js
          node --check src/rating/universal/confidence.js
          node --check src/rating/universal/estimator.js
          node --check src/rating/universal/service.js
          node --check src/rating/universal/index.js
          node --check test/universal-rating-v1.test.js
      - name: Universal rating invariant tests
        run: node --test test/universal-rating-v1.test.js
      - name: Safety flags remain off
        run: node -e "const x=require('./src/rating/universal');if(x.production_active!==false||x.automatic_promotion!==false)process.exit(1);console.log('UNIVERSAL RATING V1 SAFETY: PASS')"
