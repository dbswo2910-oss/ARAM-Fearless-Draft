name: v0.17.1 Rating Auto Sync Test Bundle

on:
  push:
    branches:
      - feature/v0171-rating-auto-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Rating auto-sync and legacy compatibility
        shell: pwsh
        run: |
          node test/universal-rating-shadow-diagnostics-v1.test.js
          if ($LASTEXITCODE -ne 0) { throw 'shadow diagnostics compatibility failed' }
          node test/universal-rating-shadow-transparency-v1.test.js
          if ($LASTEXITCODE -ne 0) { throw 'shadow transparency compatibility failed' }
          node tools/v0171-rating-auto-sync-audit.js
          if ($LASTEXITCODE -ne 0) { throw 'v0.17.1 auto-sync audit failed' }

      - name: Materialize verified installed-like v0.17.0 base
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'aram-v0171-test-app'
          & ./tools/release/prepare-v0171-test-base.ps1 -OutDir $app
          if ($LASTEXITCODE -ne 0) { throw 'test base preparation failed' }
          "V0171_TEST_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply v0.17.1 test runtime overlay
        shell: pwsh
        run: |
          node tools/release/build-v0171-test-runtime.js --app "$env:V0171_TEST_APP"
          if ($LASTEXITCODE -ne 0) { throw 'v0.17.1 test runtime build failed' }
          $pkg = Get-Content (Join-Path $env:V0171_TEST_APP 'package.json') -Raw | ConvertFrom-Json
          if ([string]$pkg.version -ne '0.17.1') { throw "test package version mismatch: $($pkg.version)" }
          if (!(Test-Path (Join-Path $env:V0171_TEST_APP 'V0171_TEST_BUILD.json'))) { throw 'test build marker missing' }

      - name: Download pinned Electron runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64'
          $uri = 'https://github.com/electron/electron/releases/download/v38.7.2/electron-v38.7.2-win32-x64.zip'
          $expected = '0401b898a8d83523694bd0afa6dc3035a54c57404a914725baa621c3378b5885'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "Electron ZIP SHA-256 mismatch: $hash" }
          Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $runtime -Force
          $electron = Join-Path $runtime 'electron.exe'
          if (!(Test-Path $electron)) { throw 'electron.exe missing' }
          $ver = (& $electron --version | Out-String).Trim()
          if ($ver -ne 'v38.7.2') { throw "Electron version mismatch: $ver" }
          "V0171_ELECTRON_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble isolated portable Windows test app
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist\v0171-test'
          $bundle = Join-Path $root 'ARAM-Fearless-Draft-v0.17.1-TEST'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item (Join-Path $env:V0171_ELECTRON_RUNTIME '*') $bundle -Recurse -Force
          $resources = Join-Path $bundle 'resources'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Remove-Item (Join-Path $resources 'default_app.asar') -Force -ErrorAction SilentlyContinue
          Copy-Item $env:V0171_TEST_APP (Join-Path $resources 'app') -Recurse -Force
          $exe = Join-Path $bundle 'electron.exe'
          $testExe = Join-Path $bundle 'ARAM-Fearless-Draft-v0.17.1-TEST.exe'
          Move-Item $exe $testExe -Force
          $bat = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'set "ARAM_UNIVERSAL_SHADOW_USER_DATA_ROOT=%~dp0test-user-data"',
            'set "ARAM_UNIVERSAL_RATING_DB_ROOT=%~dp0test-user-data"',
            'start "ARAM v0.17.1 TEST" "%~dp0ARAM-Fearless-Draft-v0.17.1-TEST.exe" --v0171-physical-test',
            'endlocal'
          )
          $bat | Set-Content (Join-Path $bundle 'START-v0.17.1-TEST.bat') -Encoding ascii
          $readme = @(
            'ARAM Fearless Draft v0.17.1 TEST',
            '================================',
            '',
            '이 빌드는 정식 업데이트가 아니라 자동 Rating 동기화 실기 검증용 포터블 빌드입니다.',
            '반드시 START-v0.17.1-TEST.bat 로 실행하세요.',
            '기존 설치본의 userData와 분리된 test-user-data 폴더를 사용합니다.',
            '',
            '검증 순서',
            '1) 롤 클라이언트를 켠 상태에서 START-v0.17.1-TEST.bat 실행',
            '2) 일반 칼바람(Queue 450) 1판 플레이',
            '3) 게임 종료 후 약 5초~30초 대기',
            '4) Rating 자동동기화가 1회만 발생하는지 확인',
            '5) 같은 경기가 중복 저장되지 않는지 확인',
            '6) 전적/프로필/AutoSync/RANDOM/DATA/IN GAME 기능이 정상인지 확인',
            '',
            '이 테스트 빌드는 production manifest를 변경하지 않습니다.'
          )
          $readme | Set-Content (Join-Path $bundle 'README-TEST.txt') -Encoding utf8
          "V0171_BUNDLE_DIR=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Portable cold-start smoke
        shell: pwsh
        run: |
          $bundle = $env:V0171_BUNDLE_DIR
          $exe = Join-Path $bundle 'ARAM-Fearless-Draft-v0.17.1-TEST.exe'
          $env:ARAM_UNIVERSAL_SHADOW_USER_DATA_ROOT = Join-Path $bundle 'ci-test-user-data'
          $env:ARAM_UNIVERSAL_RATING_DB_ROOT = $env:ARAM_UNIVERSAL_SHADOW_USER_DATA_ROOT
          $stdout = Join-Path $env:RUNNER_TEMP 'v0171-test-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v0171-test-stderr.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('--v0171-ci-smoke') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $p.HasExited
          $stderrText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          if (-not $alive) { throw "portable test app exited early: $($p.ExitCode) `n$stderrText" }
          if ($stderrText -match 'App threw an error|Cannot find module|index contract mismatch') { throw "portable test app fatal stderr: $stderrText" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $bundle 'ci-test-user-data') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Archive test bundle
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'dist\ARAM-Fearless-Draft-v0.17.1-TEST-windows-x64.zip'
          Compress-Archive -Path "$env:V0171_BUNDLE_DIR\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  ARAM-Fearless-Draft-v0.17.1-TEST-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "TEST BUNDLE SHA256=$sha"

      - name: Upload v0.17.1 physical test bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARAM-Fearless-Draft-v0.17.1-TEST-windows-x64
          path: |
            dist/ARAM-Fearless-Draft-v0.17.1-TEST-windows-x64.zip
            dist/ARAM-Fearless-Draft-v0.17.1-TEST-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
