name: v0.16.0 Stability Foundation

on:
  push:
    branches:
      - stability/v0160-clean-baseline-foundation
      - stability/v0160-clean-baseline-phaseb
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Golden baseline contract
        run: node tools/stability/golden-baseline-audit.js
      - name: Repository inventory and runtime dependency graph
        run: node tools/stability/inventory.js
      - name: UI contract registry
        run: node tools/stability/ui-contract-audit.js
      - name: Canonical owner registry
        run: node tools/stability/canonical-owner-audit.js
      - name: Foundational subsystem shadow contracts
        run: node tools/stability/subsystem-shadow-audit.js
      - name: Canonical state semantic differential
        run: node tools/stability/state-canonical-differential-audit.js
      - name: Canonical lifecycle semantic differential
        run: node tools/stability/lifecycle-canonical-differential-audit.js
      - name: Canonical updater transaction differential
        run: node tools/stability/updater-canonical-differential-audit.js
      - name: Canonical updater boot guard differential
        run: node tools/stability/updater-boot-guard-canonical-differential-audit.js
      - name: Canonical AutoSync semantic differential
        run: node tools/stability/autosync-canonical-differential-audit.js
      - name: Canonical Riot semantic differential
        run: node tools/stability/riot-canonical-differential-audit.js
      - name: Canonical Draft semantic differential
        run: node tools/stability/draft-canonical-differential-audit.js
      - name: Canonical RANDOM candidate DNA differential
        run: node tools/stability/random-dna-canonical-differential-audit.js
      - name: Canonical RANDOM selection state differential
        run: node tools/stability/random-selection-canonical-differential-audit.js
      - name: Final assembled runtime
        run: node tools/stability/final-runtime-audit.js
      - name: Golden runtime fingerprints
        run: node tools/stability/runtime-fingerprint-audit.js
      - name: Behavioral differential fixture suite
        run: node tools/stability/behavioral-differential-audit.js
      - name: State and Research compatibility
        run: node tools/stability/state-compat-audit.js
      - name: Diagnostics contract
        run: node tools/stability/diagnostics-audit.js
      - name: Existing full regression core
        run: node tools/full-regression-audit.js
      - name: AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload foundation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-stability-foundation
          path: |
            audit-output/stability
            audit-output/full-regression-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: error

  windows-electron-synthetic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Electron runner
        shell: pwsh
        run: npm install --no-save --no-package-lock electron@38.7.2
      - name: Run Windows Electron restart-persistence / DOM / soak / screenshots
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          if (!(Test-Path $exe)) { throw "Electron executable missing: $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList 'stability/e2e/synthetic-main.js' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Electron synthetic E2E exited $($proc.ExitCode)" }
          $report = Join-Path $PWD 'audit-output/stability/windows-e2e/synthetic-e2e-report.json'
          if (!(Test-Path $report)) { throw "Synthetic E2E report missing after Electron exit: $report" }
          Get-ChildItem -Recurse 'audit-output/stability/windows-e2e' | Select-Object FullName,Length
      - name: Upload Windows synthetic screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-windows-electron-synthetic
          path: audit-output/stability/windows-e2e
          if-no-files-found: error
