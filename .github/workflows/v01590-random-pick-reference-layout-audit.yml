name: v0.15.90 RANDOM Pick Reference Layout Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run RANDOM pick reference layout audit
        run: node tools/random-pick-reference-layout-v01590-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-pick-reference-layout-v01590-report
          path: audit-output/random-pick-reference-layout-v01590-report.json
          if-no-files-found: error
