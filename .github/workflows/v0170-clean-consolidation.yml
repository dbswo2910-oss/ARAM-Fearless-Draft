name: v0.17.0 Clean Consolidation

on:
  push:
    branches:
      - 'refactor/v0170-clean-consolidation'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  consolidation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inventory v0.16.3 successor debt
        run: node tools/consolidation/v0170-successor-inventory.js
      - name: Build static clean runtime from validated v0.16.3 behavior
        run: |
          node tools/consolidation/build-v0170-clean-runtime.js
          node tools/sync-current-state.js
      - name: Syntax check clean runtime
        run: |
          node --check src/app/main.js
          node --check src/app/legacy-safety-bootstrap.js
          node --check src/app/preload.js
          node --check legacy-runtime-core.js
          node --check update/v0.17.0/src/app/main.js
          node --check update/v0.17.0/src/app/legacy-safety-bootstrap.js
          node --check update/v0.17.0/preload.js
          node --check update/v0.17.0/legacy-runtime-core.js
          node --check tools/consolidation/capture-effective-commonjs.js
          node --check tools/consolidation/build-v0170-clean-runtime.js
          node --check tools/consolidation/v0170-clean-audit.js
      - name: Strict no-wrapper consolidation audit
        run: node tools/consolidation/v0170-clean-audit.js
      - name: Continuity snapshot matches clean distribution
        run: node tools/sync-current-state.js --check
      - name: PR must already contain authoritative generated runtime
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git diff --quiet -- legacy-runtime-core.js src/app/preload.js update/v0.17.0 update/manifest.json update/current-state.json docs/CURRENT_STATE.md; then
            echo 'v0.17.0 generated runtime/distribution metadata is stale in PR head.'
            git diff --stat
            exit 1
          fi
      - name: Commit generated clean runtime on refactor branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/v0170-clean-consolidation'
        shell: bash
        run: |
          if git diff --quiet -- legacy-runtime-core.js src/app/preload.js update/v0.17.0 update/manifest.json update/current-state.json docs/CURRENT_STATE.md; then
            echo 'Clean runtime already authoritative.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy-runtime-core.js src/app/preload.js update/v0.17.0 update/manifest.json update/current-state.json docs/CURRENT_STATE.md
          git commit -m 'refactor: materialize authoritative v0.17 clean runtime'
          git push origin HEAD:refactor/v0170-clean-consolidation
      - name: Upload consolidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0170-clean-consolidation
          path: |
            audit-output/consolidation/v0170-successor-inventory.json
            audit-output/consolidation/v0170-clean-runtime-build.json
            audit-output/consolidation/v0170-clean-audit.json
