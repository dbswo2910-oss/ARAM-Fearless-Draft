name: Package v0.15.130 Production Rating UI + Cold Start

on:
  push:
    branches: [ release/v0.15.130 ]
    paths:
      - 'update/v0.15.130/**'
      - 'launcher/stable-v203/**'
      - 'tools/package-v015130-production-rating-ui.js'
      - '.github/workflows/v015130-package-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[v015130-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.15.130
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Format and verify launcher lifecycle fixtures
        working-directory: launcher/stable-v203
        run: |
          gofmt -w *.go
          go test ./...
      - name: Build stable Windows launcher v2.0.3
        working-directory: launcher/stable-v203
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../update/v0.15.130/ARAM_Fearless_Draft_Launcher_windows_x64.exe .
          python - <<'PY'
          from pathlib import Path
          p=Path('../../update/v0.15.130/ARAM_Fearless_Draft_Launcher_windows_x64.exe')
          b=p.read_bytes()
          assert b[:2]==b'MZ' and len(b)>100000, (b[:2],len(b))
          print('launcher PE bytes',len(b))
          PY
      - name: Package v0.15.130 updater manifest
        run: |
          node tools/package-v015130-production-rating-ui.js
          node -c update/v0.15.130/rating-engine-v01.js
          node -c update/v0.15.130/research-ui-core.js
          node -c update/v0.15.130/research-ui-devtools.js
          node -c update/v0.15.130/cold-start-promotion-v015130.js
          node -c update/v0.15.130/runtime-source-stability-v015130.js
          node -c update/v0.15.130/main-v015130.js
          node -c update/v0.15.130/successor-route-v015130.js
      - name: Sync AI continuity snapshot
        run: node tools/sync-current-state.js
      - name: Commit generated updater package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/stable-v203/*.go update/manifest.json update/v0.15.130 update/current-state.json docs/CURRENT_STATE.md
          if git diff --cached --quiet; then echo 'nothing to generate'; exit 0; fi
          git commit -m 'release: finalize v0.15.130 updater package [v015130-generated]'
          git push origin HEAD:release/v0.15.130
