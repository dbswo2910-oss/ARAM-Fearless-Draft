name: v0.15.81 Item Recommendation Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cross-archetype item recommendation audit
        run: node tools/item-recommendation-v01581-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-recommendation-v01581-report
          path: audit-output/item-recommendation-v01581-report.json
          if-no-files-found: error
