name: v0.15.104 Activate Startup Hotfix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015104-activate-startup-hotfix.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Startup hotfix audit
        run: node tools/startup-hotfix-v015104-audit.js
      - name: Core regression before activation
        run: node tools/full-regression-audit.js
      - name: Patch v0.15.104 manifest and README
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.version='0.15.104';
          m.message='v0.15.104 · STARTUP HOTFIX — fixes the v0.15.103 main-process anchor mismatch while preserving the restored RANDOM layout and Data top navigation';
          function upsert(path,source){m.files=m.files.filter(x=>x.path!==path);m.files.push({path,source})}
          upsert('ui-layout-restore-v015103.js','update/v0.15.103/ui-layout-restore-v015103.js');
          upsert('runtime-source-stability-v015104.js','update/v0.15.104/runtime-source-stability-v015104.js');
          upsert('main-v015104.js','update/v0.15.104/main-v015104.js');
          upsert('package.json','update/v0.15.104/package.json');
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          const rp='README.md';let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.104**');
          const note='- **v0.15.104**: emergency startup hotfix for the v0.15.103 `runtime script anchor mismatch`. The launcher now resumes from the proven v0.15.100 behavior-bearing main wrapper and injects the v0.15.103 RANDOM/Data UI restore through the runtime source-stability pipeline. No scoring changes.';
          if(!r.includes('**v0.15.104**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);
          NODE
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.104 startup hotfix'
            git push
          fi
