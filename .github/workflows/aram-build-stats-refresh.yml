name: ARAM Build Stats Refresh

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/aram-build-stats-refresh.js'
      - '.github/workflows/aram-build-stats-refresh.yml'

permissions:
  contents: write

concurrency:
  group: aram-build-stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch all standard-ARAM champion builds
        run: node tools/aram-build-stats-refresh.js
      - name: Validate cache before publishing
        run: |
          node - <<'NODE'
          const x=require('./data/aram-builds/current.json');
          const rows=Object.values(x.champions||{});
          if(x.mode!=='ARAM'||!x.excludes?.includes('ARAM_MAYHEM'))throw new Error('standard ARAM mode contract failed');
          if(rows.length<170||x.rosterCount!==rows.length)throw new Error('roster contract failed '+rows.length+'/'+x.rosterCount);
          if(x.provider!=='OP.GG'||!/^\d+\.\d+$/.test(String(x.canonicalPatch||'')))throw new Error('source/patch contract failed');
          for(const r of rows){if(!r.championId||!r.name||!Array.isArray(r.coreItemIds)||r.coreItemIds.length<2||new Set(r.coreItemIds).size!==r.coreItemIds.length||r.tree!==r.coreNames.join(' → '))throw new Error('invalid build row '+JSON.stringify(r));}
          console.log('ARAM cache valid:',x.canonicalPatch,rows.length,'champions');
          NODE
      - name: Sync updater-safe distribution mirror
        run: |
          mkdir -p update/data/aram-builds
          cp data/aram-builds/current.json update/data/aram-builds/current.json
          cmp --silent data/aram-builds/current.json update/data/aram-builds/current.json
      - name: Publish only material build-path changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add data/aram-builds/current.json update/data/aram-builds/current.json
          if git diff --cached --quiet; then
            echo 'No material ARAM build-path changes'
          else
            git commit -m "data: refresh ARAM build cache"
            git push
          fi
