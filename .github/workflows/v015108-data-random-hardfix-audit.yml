name: v0.15.108 DATA RANDOM Hardfix Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.108/**'
      - 'tools/v015108-data-random-hardfix-audit.js'
      - '.github/workflows/v015108-data-random-hardfix-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'update/v0.15.108/**'
      - 'tools/v015108-data-random-hardfix-audit.js'
      - '.github/workflows/v015108-data-random-hardfix-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.108 hardfix audit
        run: node tools/v015108-data-random-hardfix-audit.js
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015108-data-random-hardfix-report
          path: audit-output/v015108-data-random-hardfix-report.json
          if-no-files-found: error
