name: Hotfix v0.15.130 Launcher Bootstrap

on:
  push:
    branches:
      - hotfix/v015130-launcher-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v015130-launcher-bootstrap
          fetch-depth: 0
      - name: Patch bootstrap launcher floor
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('update/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          assert m['version']=='0.15.130', m['version']
          assert m['min_launcher']=='2.0.3', m['min_launcher']
          launcher=[f for f in m['files'] if f.get('path')=='ARAM_Fearless_Draft_Launcher_windows_x64.exe']
          assert len(launcher)==1, 'bundled launcher v2.0.3 missing from manifest'
          assert any(f.get('path')=='package.json' and f.get('source')=='update/v0.15.130/package.json' for f in m['files'])
          m['min_launcher']='2.0.2'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify bootstrap deadlock is removed
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('update/manifest.json','utf8'));
          const parts=v=>String(v).split('.').map(x=>parseInt(x,10)||0);
          const cmp=(a,b)=>{const A=parts(a),B=parts(b),L=Math.max(A.length,B.length);for(let i=0;i<L;i++){if((A[i]||0)!==(B[i]||0))return (A[i]||0)>(B[i]||0)?1:-1}return 0};
          if(cmp('2.0.2',m.min_launcher)<0) throw new Error('v2.0.2 would still be blocked');
          if(m.version!=='0.15.130') throw new Error('release version changed');
          const src=fs.readFileSync('update/v0.15.70/main.js','utf8');
          if(!src.includes('manifest.min_launcher&&compareVersion(LAUNCHER_VERSION,manifest.min_launcher)<0')) throw new Error('expected launcher gate not found');
          console.log('PASS: launcher 2.0.2 can now download v0.15.130, which bundles/promotes launcher 2.0.3');
          NODE
      - name: Remove one-shot workflow and commit hotfix
        run: |
          rm .github/workflows/hotfix-v015130-launcher-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json .github/workflows/hotfix-v015130-launcher-bootstrap.yml
          git commit -m 'hotfix: allow launcher 2.0.2 to bootstrap v0.15.130'
          git push origin HEAD:hotfix/v015130-launcher-bootstrap
