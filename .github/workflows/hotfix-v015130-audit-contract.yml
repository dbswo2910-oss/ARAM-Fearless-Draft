name: Hotfix v0.15.130 Audit Contract

on:
  push:
    branches:
      - hotfix/v015130-launcher-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v015130-launcher-bootstrap
          fetch-depth: 0
      - name: Align production audit with transition launcher floor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/v015130-production-rating-ui-audit.js')
          s=p.read_text(encoding='utf-8')
          old="if(String(manifest.min_launcher)!=='2.0.3')throw new Error('manifest min_launcher must be 2.0.3')"
          new="if(String(manifest.min_launcher)!=='2.0.2')throw new Error('manifest transition min_launcher must be 2.0.2 so v0.15.129 can bootstrap bundled launcher 2.0.3')"
          assert old in s, 'old min_launcher assertion not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node tools/v015130-production-rating-ui-audit.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/hotfix-v015130-audit-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/v015130-production-rating-ui-audit.js .github/workflows/hotfix-v015130-audit-contract.yml
          git commit -m 'test: allow v0.15.129 launcher bootstrap transition'
          git push origin HEAD:hotfix/v015130-launcher-bootstrap
