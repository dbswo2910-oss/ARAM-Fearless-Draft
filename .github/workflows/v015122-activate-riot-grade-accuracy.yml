name: v0.15.122 Historical Riot Grade Activation Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current continuity snapshot
        run: node tools/sync-current-state.js --check
      - name: Verify current AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Historical activation is intentionally disabled
        run: |
          echo 'v0.15.122 is superseded. This workflow is audit-only and must never mutate update/manifest.json or push an old release.'
          node -c tools/v015122-riot-grade-accuracy-audit.js
