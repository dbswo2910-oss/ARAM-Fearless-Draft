name: v0.15.98 Activate Result Integrity Hotfix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v01598-activate-result-integrity-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[v01598-activate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Activate v0.15.98 manifest and README
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mf='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mf,'utf8'));
          m.version='0.15.98';
          m.message='v0.15.98 · RESULTS INTEGRITY + VISUAL HOTFIX — real team KP/ranks, item artwork, square champion portraits, upgraded result coaching and reference-style UI';
          const by=new Map((m.files||[]).map((x,i)=>[x.path,i]));
          function set(path,source){const x={path,source};if(by.has(path))m.files[by.get(path)]=x;else{by.set(path,m.files.length);m.files.push(x)}}
          set('package.json','update/v0.15.98/package.json');
          set('main-v01598.js','update/v0.15.98/main-v01598.js');
          set('runtime-source-stability-v01598.js','update/v0.15.98/runtime-source-stability-v01598.js');
          fs.writeFileSync(mf,JSON.stringify(m));

          const rf='README.md';
          let r=fs.readFileSync(rf,'utf8');
          r=r.replace(/\*\*Active update:\*\* `v0\.15\.97[^`]*`/,'**Active update:** `v0.15.98 · IN GAME Results Integrity + Visual Hotfix`');
          const anchor='- **v0.15.97 IN GAME Results Parser:**';
          const bullet='- **v0.15.98 IN GAME Results Integrity + Visual:** 결과 탭의 `킬 관여`를 실제 팀 킬 기준 KP%로 수정하고 팀 내 피해/받은 피해 순위·딜 비중·CC 단위를 추가했습니다. 숫자 itemId는 공용 아이템 아트 resolver를 통해 아이콘으로 표시하며, 챔피언 초상은 정사각 프레임을 강제해 레터박스/비율 깨짐을 수정했습니다. 결과 카드/최근 경기/추이 UI도 레퍼런스에 맞춰 재정리했고 INGAME COACH 표시 버전도 현재 버전으로 동기화합니다. 추천/점수 엔진은 변경하지 않았습니다.\n';
          if(!r.includes('**v0.15.98 IN GAME Results Integrity + Visual:**')){const i=r.indexOf(anchor);if(i>=0)r=r.slice(0,i)+bullet+r.slice(i);else r+='\n'+bullet}
          fs.writeFileSync(rf,r);
          NODE
          node tools/ingame-results-integrity-v01598-audit.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/manifest.json README.md
          git commit -m "[v01598-activate] activate result integrity visual hotfix"
          git push
