name: Community Calibration Smoke Test

on:
  push:
    paths:
      - '.github/workflows/community-calibration-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: POST one synthetic calibration event
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "schema_version": 1,
            "policy_version": 1,
            "events": [
              {
                "anonymous_install_id": "github-smoke-test-0001",
                "game_hash": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
                "queue_id": 450,
                "patch_version": "26.18",
                "app_version": "0.15.36",
                "engine_version": "SMOKE_TEST_V1",
                "champion_id": 103,
                "role": "메이지",
                "role_score": 88.5,
                "role_grade": "A+",
                "riot_grade": "S-",
                "win": true,
                "game_duration": 1200,
                "data_quality": "synthetic-smoke-test",
                "raw_gameplay_schema": 0,
                "raw_gameplay": {},
                "derived_signals": {},
                "telemetry_field_count": 0,
                "captured_at": 0
              }
            ]
          }
          JSON

          RESPONSE=$(curl -sS -X POST \
            'https://aram-community-calibration.dbswo2910.workers.dev/v1/calibration' \
            -H 'content-type: application/json' \
            --data-binary @payload.json)

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
          echo "$RESPONSE" | grep -q '"accepted":1'
