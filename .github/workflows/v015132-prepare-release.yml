name: v0.15.132 Prepare Release Metadata

on:
  push:
    branches:
      - fix/v0.15.132-storage-root-patchnotes-runtime

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'release-meta: v0.15.132') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v0.15.132-storage-root-patchnotes-runtime
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare manifest and continuity snapshot
        run: node tools/prepare-v015132-release.js
      - name: Commit generated release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/manifest.json update/current-state.json docs/CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "release-meta: v0.15.132 generated manifest"
          git push origin HEAD:fix/v0.15.132-storage-root-patchnotes-runtime
