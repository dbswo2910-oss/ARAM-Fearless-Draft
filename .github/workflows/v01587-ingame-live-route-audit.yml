name: v0.15.87 RANDOM Live Route Adoption Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run RANDOM live route-adoption audit
        run: node tools/ingame-live-route-v01587-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-live-route-v01587-report
          path: audit-output/ingame-live-route-v01587-report.json
          if-no-files-found: error
