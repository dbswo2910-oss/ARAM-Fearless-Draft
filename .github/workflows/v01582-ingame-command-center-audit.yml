name: v0.15.82 IN GAME Command Center Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run IN GAME command-center audit
        run: node tools/ingame-command-center-v01582-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-command-center-v01582-report
          path: audit-output/ingame-command-center-v01582-report.json
          if-no-files-found: error
