name: v0.15.110 Patch Notes Density Audit

on:
  pull_request:
    paths:
      - 'update/v0.15.110/**'
      - 'tools/v015110-patch-notes-density-audit.js'
      - '.github/workflows/v015110-patch-notes-density-audit.yml'
      - '.github/workflows/v015110-activate-patch-notes-density.yml'
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.110/**'
      - 'tools/v015110-patch-notes-density-audit.js'
      - '.github/workflows/v015110-patch-notes-density-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.110 Patch Notes density audit
        run: node tools/v015110-patch-notes-density-audit.js
      - name: Run v0.15.109 UI polish audit
        run: node tools/v015109-screenshot-polish-audit.js
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015110-patch-notes-density-audit
          path: audit-output/v015110-patch-notes-density-report.json
          if-no-files-found: ignore
