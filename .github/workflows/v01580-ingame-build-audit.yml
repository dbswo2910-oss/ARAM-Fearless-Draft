name: v0.15.80 In-game Build Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect release version
        id: release
        run: echo "version=$(node -p \"require('./update/manifest.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Run v0.15.80 in-game build audit
        if: steps.release.outputs.version == '0.15.80'
        run: node tools/ingame-build-v01580-audit.js
      - name: Run v0.15.80 latest-only item artwork audit
        if: steps.release.outputs.version == '0.15.80'
        run: node tools/item-art-latest-v01580-audit.js
      - name: Successor note
        if: steps.release.outputs.version != '0.15.80'
        run: echo "v0.15.80 exact-release audit is historical; successor-specific CI owns version $(node -p \"require('./update/manifest.json').version\")."
      - name: Upload v0.15.80 audit reports
        if: always() && steps.release.outputs.version == '0.15.80'
        uses: actions/upload-artifact@v4
        with:
          name: ingame-build-v01580-report
          path: |
            audit-output/ingame-build-v01580-report.json
            audit-output/item-art-latest-v01580-report.json
          if-no-files-found: error
