name: v0.15.110 Activate Patch Notes Density

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015110-activate-patch-notes-density.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015110-patch-notes-density-audit.js
          node tools/v015109-screenshot-polish-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.110 manifest + docs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          m.version='0.15.110';
          m.message='v0.15.110 · PATCH NOTES DENSITY — compact champion portraits and card grid';
          const remove=new Set(['patch-notes-density-v015110.js','runtime-source-stability-v015110.js','main-v015110.js']);
          m.files=(m.files||[]).filter(x=>!remove.has(x.path));
          const pkg=m.files.find(x=>x.path==='package.json');
          if(!pkg)throw new Error('manifest package.json missing');
          pkg.source='update/v0.15.110/package.json';
          let idx=m.files.findIndex(x=>x.path==='ui-screenshot-polish-v015109.js');
          if(idx<0)throw new Error('v0.15.109 UI anchor missing');
          m.files.splice(idx+1,0,{path:'patch-notes-density-v015110.js',source:'update/v0.15.110/patch-notes-density-v015110.js'});
          idx=m.files.findIndex(x=>x.path==='runtime-source-stability-v015109.js');
          if(idx<0)throw new Error('v0.15.109 runtime anchor missing');
          m.files.splice(idx+1,0,{path:'runtime-source-stability-v015110.js',source:'update/v0.15.110/runtime-source-stability-v015110.js'});
          idx=m.files.findIndex(x=>x.path==='main-v015109.js');
          if(idx<0)throw new Error('v0.15.109 main anchor missing');
          m.files.splice(idx+1,0,{path:'main-v015110.js',source:'update/v0.15.110/main-v015110.js'});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';
          let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.110**');
          const note='- **v0.15.110**: Patch Notes champion-density hotfix. Champion portraits are locked to a compact 46×46 size inside the Patch Notes grid only; DATA tier cards and scoring remain unchanged.';
          if(!r.includes('**v0.15.110**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.110**');
          const hnote='\n### v0.15.110 — Patch Notes champion density\n\nScreenshot-confirmed hotfix for oversized Patch Notes champion portraits. The repair is strictly scoped to `#dataPatchNotesV01599 #dh99ChampionGrid`, force-locks portraits to 46×46 px, uses a denser responsive grid, and preserves DATA tier cards, RANDOM Practice, recommendation/scoring/item logic, v0.15.109 polish, and the v0.15.79 safety lineage. `score_logic_changed:false`.\n';
          if(!h.includes('### v0.15.110 — Patch Notes champion density'))h+=hnote;
          fs.writeFileSync(hp,h);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015110-patch-notes-density-audit.js
          node tools/v015109-screenshot-polish-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.110 patch notes density'
            git push
          fi
