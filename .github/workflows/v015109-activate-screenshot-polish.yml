name: v0.15.109 Activate Screenshot UI Polish

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015109-activate-screenshot-polish.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015109-screenshot-polish-audit.js
          node tools/v015108-data-random-hardfix-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.109 manifest + docs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          m.version='0.15.109';
          m.message='v0.15.109 · SCREENSHOT UI POLISH — correct Patch Notes labeling and restore readable RANDOM DNA visuals';
          const remove=new Set(['ui-screenshot-polish-v015109.js','runtime-source-stability-v015109.js','main-v015109.js']);
          m.files=(m.files||[]).filter(x=>!remove.has(x.path));
          const pkg=m.files.find(x=>x.path==='package.json');
          if(!pkg)throw new Error('manifest package.json missing');
          pkg.source='update/v0.15.109/package.json';
          let idx=m.files.findIndex(x=>x.path==='data-random-hardfix-v015108.js');
          if(idx<0)throw new Error('v0.15.108 UI anchor missing');
          m.files.splice(idx+1,0,{path:'ui-screenshot-polish-v015109.js',source:'update/v0.15.109/ui-screenshot-polish-v015109.js'});
          idx=m.files.findIndex(x=>x.path==='runtime-source-stability-v015108.js');
          if(idx<0)throw new Error('v0.15.108 runtime anchor missing');
          m.files.splice(idx+1,0,{path:'runtime-source-stability-v015109.js',source:'update/v0.15.109/runtime-source-stability-v015109.js'});
          idx=m.files.findIndex(x=>x.path==='main-v015108.js');
          if(idx<0)throw new Error('v0.15.108 main anchor missing');
          m.files.splice(idx+1,0,{path:'main-v015109.js',source:'update/v0.15.109/main-v015109.js'});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';
          let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.109**');
          const note='- **v0.15.109**: screenshot-confirmed visual polish. Patch Notes uses the correct outer title and RANDOM Practice DNA bars/compact intel styling are force-restored. Scoring unchanged.';
          if(!r.includes('**v0.15.109**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.109**');
          const hnote='\n### v0.15.109 — Screenshot UI polish\n\nThe v0.15.108 screenshots confirm that DATA/RANDOM view ownership is fixed. v0.15.109 only cleans remaining visual artifacts: the Patch Notes outer header no longer says `챔피언 상세`, the visible Patch Companion label no longer exposes the old v0.15.99 module version, and RANDOM candidate DNA bars / AD-AP split / compact intel typography are restored with exact scoped selectors. `score_logic_changed:false`.\n';
          if(!h.includes('### v0.15.109 — Screenshot UI polish'))h+=hnote;
          fs.writeFileSync(hp,h);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015109-screenshot-polish-audit.js
          node tools/v015108-data-random-hardfix-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.109 screenshot UI polish'
            git push
          fi
