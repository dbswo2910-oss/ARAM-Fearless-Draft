name: v0.15.133 Production Release Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'update/v0.15.133/**'
      - 'update/manifest.json'
      - 'update/current-state.json'
      - 'docs/CURRENT_STATE.md'
      - 'docs/continuity-manual.json'
      - 'docs/AI_HANDOFF.md'
      - 'docs/KNOWN_ISSUES.md'
      - 'AGENTS.md'
      - 'tools/sync-current-state.js'
      - 'tools/prepare-v015133-release.js'
      - 'tools/v015133-production-audit.js'
      - '.github/workflows/v015133-production-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Compile v0.15.133 package
        run: |
          node -c update/v0.15.133/main-v015133.js
          node -c update/v0.15.133/successor-route-v015133.js
          node -c update/v0.15.133/runtime-source-stability-v015133.js
          node -c update/v0.15.133/cold-start-promotion-v015133.js
          node -c tools/prepare-v015133-release.js
          node -c tools/v015133-production-audit.js
          node -c tools/sync-current-state.js
      - name: v0.15.133 real-Windows regression fixture
        run: node tools/v015133-production-audit.js
      - name: Cold-start launcher fixtures
        working-directory: launcher/stable-v203
        run: go test -v ./...
      - name: Full Regression
        run: node tools/full-regression-audit.js
      - name: Match History
        run: node tools/v015131-history-preservation-audit.js
      - name: Player Profile
        run: node tools/profile-ux-audit.js
      - name: AutoSync
        run: node tools/v015119-autosync-concurrency-audit.js
      - name: RANDOM
        run: node tools/v015121-random-practice-restore-audit.js
      - name: DATA and Patch Notes
        run: node tools/v015120-data-subnav-audit.js
      - name: Item
        run: node tools/item-recommendation-v01581-audit.js
      - name: Updater safety
        run: |
          node tools/v015115-single-owner-stability-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015118-resource-lifecycle-audit.js
      - name: AI continuity snapshot
        run: node tools/sync-current-state.js --check
      - name: AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015133-production-release-audit
          path: |
            audit-output/v015133-production-report.json
            audit-output/full-regression-report.json
            audit-output/profile-ux-report.json
            audit-output/v015119-autosync-concurrency-report.json
            audit-output/v015121-random-practice-restore-report.json
            audit-output/v015120-data-subnav-report.json
            audit-output/v015116-runtime-update-stability-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: warn
