name: v0.15.133 Production Release Audit (Historical / Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Compile v0.15.133 historical package
        run: |
          node -c update/v0.15.133/main-v015133.js
          node -c update/v0.15.133/successor-route-v015133.js
          node -c update/v0.15.133/runtime-source-stability-v015133.js
          node -c update/v0.15.133/cold-start-promotion-v015133.js
          node -c tools/v015133-production-audit.js
      - name: v0.15.133 historical contract audit
        run: node tools/v015133-production-audit.js
      - name: Cold-start launcher fixtures
        working-directory: launcher/stable-v203
        run: go test -v ./...
      - name: Full Regression
        run: node tools/full-regression-audit.js
      - name: AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015133-historical-production-audit
          path: |
            audit-output/v015133-production-report.json
            audit-output/full-regression-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: warn
