name: v0.16.2 Shadow Rating Diagnostics

on:
  push:
    branches:
      - 'feature/v0.16.2-shadow-rating-diagnostics'
  pull_request:
    branches: [ main ]
    paths:
      - 'update/v0.16.2/**'
      - 'src/rating/universal/runtime.js'
      - 'src/main/universal-rating-ipc.js'
      - 'src/preload/universal-rating-history-hook.js'
      - 'src/profile/shadow-rating-diagnostics-renderer.js'
      - 'test/universal-rating-shadow-diagnostics-v1.test.js'
      - 'tools/release/build-v0162-shadow-rating-diagnostics-manifest.js'
      - 'update/manifest.json'
      - 'update/current-state.json'
      - 'docs/CURRENT_STATE.md'
      - '.github/workflows/v0162-shadow-rating-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnostics-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check diagnostics payload
        run: |
          node --check src/rating/universal/runtime.js
          node --check src/main/universal-rating-ipc.js
          node --check src/preload/universal-rating-history-hook.js
          node --check src/profile/shadow-rating-diagnostics-renderer.js
          node --check update/v0.16.2/main-v0162-shadow-diagnostics.js
          node --check update/v0.16.2/preload-v0162-shadow-diagnostics.js
          node --check update/v0.16.2/src/rating/universal/runtime.js
          node --check update/v0.16.2/src/main/universal-rating-ipc.js
          node --check update/v0.16.2/src/preload/universal-rating-history-hook.js
          node --check update/v0.16.2/src/profile/shadow-rating-diagnostics-renderer.js
          node --check test/universal-rating-shadow-diagnostics-v1.test.js
          node --check tools/release/build-v0162-shadow-rating-diagnostics-manifest.js
      - name: Shadow diagnostics invariant tests
        run: node test/universal-rating-shadow-diagnostics-v1.test.js
      - name: Verify updater mirrors match source payload byte-for-byte
        run: |
          set -euo pipefail
          mirrors=(
            'update/v0.16.2/src/main/universal-rating-ipc.js|src/main/universal-rating-ipc.js'
            'update/v0.16.2/src/preload/universal-rating-history-hook.js|src/preload/universal-rating-history-hook.js'
            'update/v0.16.2/src/rating/universal/runtime.js|src/rating/universal/runtime.js'
            'update/v0.16.2/src/profile/shadow-rating-diagnostics-renderer.js|src/profile/shadow-rating-diagnostics-renderer.js'
          )
          for pair in "${mirrors[@]}"; do
            release_file="${pair%%|*}"
            source_file="${pair#*|}"
            cmp --silent "$release_file" "$source_file" || { echo "updater mirror mismatch: $release_file != $source_file"; exit 1; }
          done
          echo 'V0.16.2 UPDATE MIRROR BYTE MATCH: PASS'
      - name: Build authoritative v0.16.2 manifest and continuity snapshot
        run: |
          node tools/release/build-v0162-shadow-rating-diagnostics-manifest.js
          node tools/sync-current-state.js
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('update/manifest.json','utf8'));
          const state=JSON.parse(fs.readFileSync('update/current-state.json','utf8'));
          if(m.version!=='0.16.2')throw new Error(`manifest version ${m.version}`);
          if(m.production_rating_active!==false||m.automatic_rating_promotion!==false||m.universal_rating_shadow!==true||m.universal_rating_shadow_diagnostics!==true)throw new Error('shadow diagnostics safety metadata invalid');
          if(state.active?.version!=='0.16.2'||state.package?.version!=='0.16.2'||state.package?.main!=='main-v0162-shadow-diagnostics.js')throw new Error('continuity snapshot did not adopt v0.16.2');
          for(const e of m.files||[])if(!String(e.source||'').startsWith('update/'))throw new Error(`unsafe updater source ${e.path} -> ${e.source}`);
          const by=new Map((m.files||[]).map(x=>[x.path,x]));
          const expected={
            'package.json':'update/v0.16.2/package.json',
            'main-v0162-shadow-diagnostics.js':'update/v0.16.2/main-v0162-shadow-diagnostics.js',
            'preload.js':'update/v0.16.2/preload-v0162-shadow-diagnostics.js',
            'src/main/universal-rating-ipc.js':'update/v0.16.2/src/main/universal-rating-ipc.js',
            'src/preload/universal-rating-history-hook.js':'update/v0.16.2/src/preload/universal-rating-history-hook.js',
            'src/rating/universal/runtime.js':'update/v0.16.2/src/rating/universal/runtime.js',
            'src/profile/shadow-rating-diagnostics-renderer.js':'update/v0.16.2/src/profile/shadow-rating-diagnostics-renderer.js'
          };
          for(const [p,s] of Object.entries(expected)){
            const e=by.get(p);
            if(!e||e.source!==s||!/^[0-9a-f]{64}$/.test(String(e.sha256||'')))throw new Error(`missing verified v0.16.2 release entry ${p}`);
          }
          console.log('V0.16.2 MANIFEST + CONTINUITY + SECURE TRANSPORT: PASS');
          NODE
          node tools/sync-current-state.js --check
      - name: Commit generated distribution metadata on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.16.2-shadow-rating-diagnostics'
        run: |
          if git diff --quiet -- update/manifest.json update/current-state.json docs/CURRENT_STATE.md; then
            echo 'Distribution metadata already authoritative; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json update/current-state.json docs/CURRENT_STATE.md
          git commit -m 'release: sync authoritative v0.16.2 distribution metadata'
          git push origin HEAD:feature/v0.16.2-shadow-rating-diagnostics
      - name: Safety remains diagnostics-only shadow
        run: |
          node - <<'NODE'
          const rt=require('./src/rating/universal/runtime');
          const ipc=require('./src/main/universal-rating-ipc');
          const hook=require('./src/preload/universal-rating-history-hook');
          const view=require('./src/profile/shadow-rating-diagnostics-renderer');
          for(const x of [rt,ipc,hook,view])if(x.production_active!==false)throw new Error('production flag activated');
          if(rt.automatic_promotion!==false||ipc.automatic_promotion!==false||hook.automatic_promotion!==false||view.automatic_promotion!==false)throw new Error('automatic promotion activated');
          if(ipc.network_owner!==false||hook.network_owner!==false||view.network_owner!==false)throw new Error('diagnostics acquired network ownership');
          console.log('V0.16.2 SHADOW DIAGNOSTICS SAFETY: PASS');
          NODE
