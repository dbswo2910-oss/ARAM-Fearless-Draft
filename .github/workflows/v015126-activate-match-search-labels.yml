name: v0.15.126 Activate Match Search Labels

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'update/v0.15.126/**'
      - 'tools/v015126-match-search-labels-audit.js'
      - 'tools/v015126-activate-match-search-labels.js'
      - 'tools/v015124-startup-successor-route-audit.js'
      - '.github/workflows/v015126-activate-match-search-labels.yml'
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.126/**'
      - 'tools/v015126-match-search-labels-audit.js'
      - 'tools/v015126-activate-match-search-labels.js'
      - 'tools/v015124-startup-successor-route-audit.js'
      - '.github/workflows/v015126-activate-match-search-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v015126-match-search-labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare v0.15.126 candidate
        run: node tools/v015126-activate-match-search-labels.js
      - name: Sync candidate continuity snapshot
        run: |
          node tools/sync-current-state.js
          node tools/ai-continuity-audit.js
      - name: Validate v0.15.126 visible naming contract
        run: node tools/v015126-match-search-labels-audit.js
      - name: Re-run predecessor and safety audits
        run: |
          node tools/v015125-aram-build-stat-cache-audit.js
          node tools/v015124-startup-successor-route-audit.js
          node tools/v015123-patch-notes-startup-notice-audit.js
          node tools/v015122-riot-grade-accuracy-audit.js
          node tools/v015121-random-practice-restore-audit.js
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01571-audit.js
          node tools/runtime-stability-v01573-audit.js
          node tools/runtime-stability-v01575-audit.js
          node tools/runtime-stability-v01578-audit.js
          node tools/runtime-stability-v01579-audit.js
      - name: Full Regression
        run: node tools/full-regression-audit.js

  activate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare v0.15.126 activation files
        run: node tools/v015126-activate-match-search-labels.js
      - name: Sync repository continuity snapshot
        run: |
          node tools/sync-current-state.js
          node tools/ai-continuity-audit.js
      - name: Post-activation feature and predecessor audits
        run: |
          node tools/v015126-match-search-labels-audit.js
          node tools/v015125-aram-build-stat-cache-audit.js
          node tools/v015124-startup-successor-route-audit.js
          node tools/v015123-patch-notes-startup-notice-audit.js
          node tools/v015122-riot-grade-accuracy-audit.js
          node tools/v015121-random-practice-restore-audit.js
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01571-audit.js
          node tools/runtime-stability-v01573-audit.js
          node tools/runtime-stability-v01575-audit.js
          node tools/runtime-stability-v01578-audit.js
          node tools/runtime-stability-v01579-audit.js
          node tools/ai-continuity-audit.js
      - name: Full Regression after manifest activation
        run: node tools/full-regression-audit.js
      - name: Commit verified v0.15.126 activation atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md docs/continuity-manual.json docs/CURRENT_STATE.md update/current-state.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.126 match search labels'
            git push
          fi
