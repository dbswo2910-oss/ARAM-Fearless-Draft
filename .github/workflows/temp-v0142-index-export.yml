name: TEMP v0.14.2 Base Index Export

on:
  push:
    branches:
      - stability/v0160-clean-baseline-phaseb

permissions:
  contents: read

jobs:
  export-base-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned public v0.14.2 app bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/aram-base-v0142.zip" \
            'https://github.com/dbswo2910-oss/ARAM-Fearless-Draft/releases/download/v0.14.2/ARAM_Fearless_Draft_appbundle_v0.14.2.zip'
          echo '2e076de26edb8f20a54bf0e07cfce9b6102f5f97617d8c5a3f65a03cb5671d04  '"$RUNNER_TEMP/aram-base-v0142.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE/temp-v0142-index"
          unzip -q "$RUNNER_TEMP/aram-base-v0142.zip" -d "$RUNNER_TEMP/base"
          INDEX="$(find "$RUNNER_TEMP/base" -type f -name index.html -print -quit)"
          test -n "$INDEX"
          cp "$INDEX" "$GITHUB_WORKSPACE/temp-v0142-index/index.html"
          sha256sum "$GITHUB_WORKSPACE/temp-v0142-index/index.html" > "$GITHUB_WORKSPACE/temp-v0142-index/index.html.sha256"
          wc -c "$GITHUB_WORKSPACE/temp-v0142-index/index.html" > "$GITHUB_WORKSPACE/temp-v0142-index/index.html.size"

      - name: Upload temporary base index artifact
        uses: actions/upload-artifact@v4
        with:
          name: temp-v0142-base-index
          path: temp-v0142-index
          if-no-files-found: error
          retention-days: 1
