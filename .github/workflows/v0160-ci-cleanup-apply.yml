name: v0.16.0 Historical CI Cleanup Apply

on:
  workflow_dispatch:
  push:
    branches: [ stability/v0160-clean-baseline-phaseb ]
    paths:
      - .github/workflows/v0160-ci-cleanup-trigger.txt

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stability/v0160-clean-baseline-phaseb
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize historical version-pinned workflows in place
        run: node tools/stability/normalize-historical-workflows.js --in-place
      - name: Validate cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/v015*.yml|audit-output/stability/historical-workflow-normalization.json|.github/workflows/v0160-ci-cleanup-trigger.txt)
                ;;
              *)
                echo "Unexpected cleanup change: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --exit-code -- update/manifest.json update/current-state.json update/v0.15.135 || {
            echo 'Production baseline changed during CI cleanup.' >&2
            exit 1
          }
      - name: Stage normalized workflow tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-output/stability/historical-workflow-tree
          mkdir -p audit-output/stability/historical-workflow-tree/workflows
          cp .github/workflows/v015*.yml audit-output/stability/historical-workflow-tree/workflows/
      - name: Upload normalized workflow tree and report
        uses: actions/upload-artifact@v4
        with:
          name: v0160-historical-workflow-normalized-tree
          path: |
            audit-output/stability/historical-workflow-tree
            audit-output/stability/historical-workflow-normalization.json
          if-no-files-found: error
