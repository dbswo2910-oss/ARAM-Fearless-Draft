name: v0.16.0 Historical CI Cleanup Export

on:
  push:
    branches: [ stability/v0160-clean-baseline-phaseb ]
    paths:
      - tools/stability/normalize-historical-workflows.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize historical version-pinned workflows to manual-only
        run: node tools/stability/normalize-historical-workflows.js
      - name: Upload normalized workflow tree and report
        uses: actions/upload-artifact@v4
        with:
          name: v0160-historical-workflow-normalized-tree
          path: |
            .github/workflows
            audit-output/stability/historical-workflow-normalization.json
          if-no-files-found: error
