name: v0.16.0 Historical CI Cleanup Apply

on:
  push:
    branches: [ stability/v0160-clean-baseline-phaseb ]
    paths:
      - tools/stability/normalize-historical-workflows.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize historical version-pinned workflows to manual-only
        run: node tools/stability/normalize-historical-workflows.js
      - name: Commit normalized workflow triggers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No workflow trigger changes"
            exit 0
          fi
          git commit -m "ci: make historical v0.15 workflows manual-only"
          git push origin HEAD:stability/v0160-clean-baseline-phaseb
      - name: Upload normalization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-historical-workflow-normalization
          path: audit-output/stability/historical-workflow-normalization.json
          if-no-files-found: error
