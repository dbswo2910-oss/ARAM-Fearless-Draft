name: v0.15.109 Screenshot UI Polish Audit

on:
  pull_request:
    paths:
      - 'update/v0.15.109/**'
      - 'tools/v015109-screenshot-polish-audit.js'
      - '.github/workflows/v015109-screenshot-polish-audit.yml'
      - '.github/workflows/v015109-activate-screenshot-polish.yml'
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.109/**'
      - 'tools/v015109-screenshot-polish-audit.js'
      - '.github/workflows/v015109-screenshot-polish-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.109 UI polish audit
        run: node tools/v015109-screenshot-polish-audit.js
      - name: Run v0.15.108 hardfix audit
        run: node tools/v015108-data-random-hardfix-audit.js
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015109-screenshot-polish-audit
          path: audit-output/v015109-screenshot-polish-report.json
          if-no-files-found: ignore
