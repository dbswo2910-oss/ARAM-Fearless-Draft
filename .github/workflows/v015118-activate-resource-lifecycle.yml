name: v0.15.118 Activate Resource Lifecycle Stability

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015118-activate-resource-lifecycle.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.118 resource lifecycle stability
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(String(m.version)!=='0.15.117')throw new Error(`v0.15.118 activation requires active v0.15.117, got ${m.version}`);
          const upsert=(path,source,after)=>{
            m.files=(m.files||[]).filter(x=>x.path!==path);
            let idx=after?m.files.findIndex(x=>x.path===after):-1;
            if(idx<0)idx=m.files.length-1;
            m.files.splice(idx+1,0,{path,source});
          };
          const replace=(path,source)=>{
            const f=(m.files||[]).find(x=>x.path===path);
            if(!f)throw new Error('manifest anchor missing: '+path);
            f.source=source;
          };
          m.version='0.15.118';
          m.message='v0.15.118 · RESOURCE LIFECYCLE — coalesced ticks, adaptive heartbeat, bounded observers';
          replace('runtime-loader-v01579.js','update/v0.15.118/runtime-loader-v01579.js');
          replace('package.json','update/v0.15.118/package.json');
          upsert('resource-lifecycle-v015118.js','update/v0.15.118/resource-lifecycle-v015118.js','state-integrity-renderer-v015117.js');
          upsert('runtime-source-stability-v015118.js','update/v0.15.118/runtime-source-stability-v015118.js','runtime-source-stability-v015117.js');
          upsert('main-v015118.js','update/v0.15.118/main-v015118.js','main-v015117.js');
          const installed=new Set((m.files||[]).map(x=>x.path));
          m.delete=(m.delete||[]).filter(x=>!installed.has(x));
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.118**');
          const note='- **v0.15.118**: Resource lifecycle stability. Random IN GAME tick bursts are coalesced, its heartbeat becomes adaptive when inactive/hidden, long-lived observers/timers receive explicit disposers, and CI inventories active timer/listener/observer ownership. UI ownership, persisted-state recovery, and scoring remain unchanged.';
          if(!r.includes('**v0.15.118**'))r+='\n'+note+'\n';fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.118**');
          const hnote=`\n### v0.15.118 — Resource lifecycle stability\n\nThis release is infrastructure-only. Runtime source transformation adds explicit lifecycle disposal to Random Practice, Random IN GAME, and renderer AutoSync without adding another UI owner. Random IN GAME one-shot ticks are coalesced and its permanent 1-second interval is replaced by an adaptive timeout heartbeat that backs off while inactive/hidden. Random Practice owns and disconnects its long-task observer; AutoSync follow-up polls are coalesced. \`resource-lifecycle-v015118.js\` provides a no-polling aggregate snapshot/dispose surface, and runtime readiness requires the lifecycle owner/disposers. v0.15.115 UI ownership, v0.15.117 state integrity, and scoring remain unchanged.\n`;
          if(!h.includes('### v0.15.118 — Resource lifecycle stability'))h+=hnote;fs.writeFileSync(hp,h);

          const ap='AGENTS.md';let a=fs.readFileSync(ap,'utf8');
          const rule=`\n## v0.15.118 resource lifecycle baseline\n\n- Renderer recurring work must have one clear owner and an idempotent cleanup path. Do not add a new interval/observer merely to repair output from an existing owner.\n- One-shot refresh timers must be coalesced when repeated UI events can queue the same work. Preserve the earliest due refresh and merge force-refresh intent instead of stacking callbacks.\n- Background/inactive views must not run a full-speed UI heartbeat. Prefer event-driven refresh plus an adaptive low-frequency safety heartbeat when necessary.\n- Long-lived MutationObserver/PerformanceObserver instances must be disconnectable. Runtime owners should expose \`dispose()\` when they own recurring resources.\n- \`resource-lifecycle-v015118.js\` is infrastructure only: no DOM reparenting, no polling timer, no scoring changes.\n- Keep the whole-active-manifest resource inventory in \`tools/v015118-resource-lifecycle-audit.js\` and update the audit whenever recurring ownership changes.\n`;
          if(!a.includes('## v0.15.118 resource lifecycle baseline'))a+=rule;fs.writeFileSync(ap,a);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01579-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md AGENTS.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.118 resource lifecycle stability'
            git push
          fi
