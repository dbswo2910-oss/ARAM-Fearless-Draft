name: v0.15.120 Activate DATA Patch Notes Submenu Restore

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015120-activate-data-subnav.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/ai-continuity-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.120 DATA submenu restore
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(String(m.version)!=='0.15.119')throw new Error(`v0.15.120 activation requires active v0.15.119, got ${m.version}`);
          const upsert=(path,source,after)=>{
            m.files=(m.files||[]).filter(x=>x.path!==path);
            let idx=after?m.files.findIndex(x=>x.path===after):-1;
            if(idx<0)idx=m.files.length-1;
            m.files.splice(idx+1,0,{path,source});
          };
          const replace=(path,source)=>{
            const f=(m.files||[]).find(x=>x.path===path);
            if(!f)throw new Error('manifest anchor missing: '+path);
            f.source=source;
          };
          m.version='0.15.120';
          m.message='v0.15.120 · DATA SUBMENU RESTORE — Patch Notes again owns the full DATA workspace';
          replace('ui-stability-baseline-v015115.js','update/v0.15.120/ui-stability-baseline-v015115.js');
          replace('runtime-loader-v01579.js','update/v0.15.120/runtime-loader-v01579.js');
          replace('package.json','update/v0.15.120/package.json');
          upsert('runtime-source-stability-v015120.js','update/v0.15.120/runtime-source-stability-v015120.js','runtime-source-stability-v015119.js');
          upsert('main-v015120.js','update/v0.15.120/main-v015120.js','main-v015119.js');
          const installed=new Set((m.files||[]).map(x=>x.path));
          m.delete=(m.delete||[]).filter(x=>!installed.has(x));
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.120**');
          const note='- **v0.15.120**: DATA Patch Notes submenu restore. The `챔피언 티어리스트 | 패치노트` second navigation is again owned by the full DATA workspace; Patch Notes hides the tier browser and spans the workspace. RANDOM, Riot grades, match-history sync, AutoSync and scoring are unchanged.';
          if(!r.includes('**v0.15.120**'))r+='\n'+note+'\n';fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.120**');
          const hnote=`\n### v0.15.120 — DATA Patch Notes submenu restore\n\nThe existing \`ui-stability-v015115\` DATA owner remains authoritative. v0.15.120 replaces only that owner's maintained presentation source: DATA host discovery now resolves the role-tier panel and \`#dataCard\` from their nearest shared ancestor inside exact \`#data\`, inserts \`#dataHubTopNavV015115\` as the first child of that common host, and makes Patch Notes hide the tier branch while the detail branch spans the full workspace. Do not revive v0.15.103-v0.15.114 overlays. RANDOM, Riot grade, match-history sync, AutoSync and scoring are unchanged. Final visual acceptance still requires real-Windows evidence.\n`;
          if(!h.includes('### v0.15.120 — DATA Patch Notes submenu restore'))h+=hnote;fs.writeFileSync(hp,h);

          const ap='AGENTS.md';let a=fs.readFileSync(ap,'utf8');
          const rule=`\n## v0.15.120 DATA submenu baseline\n\n- DATA presentation is still owned by \`ui-stability-v015115\`; v0.15.120 is a maintained owner revision, not a new overlay owner.\n- Discover the role-tier branch only inside exact \`#data\`, then resolve its nearest common ancestor with exact \`#dataCard\`. Never fall back to document-wide panel-title searches.\n- \`#dataHubTopNavV015115\` belongs inside that common host and spans all host columns. In Patch Notes mode, the tier branch is hidden and the detail/Patch Notes branch spans the workspace.\n- Do not restore \`card.closest('.grid2')\` as the DATA host shortcut; it was screenshot-confirmed to select the right/detail sub-grid and strand the tier browser on the left.\n- Do not reactivate v0.15.103-v0.15.114 UI overlays. RANDOM, Riot-grade, history-sync, AutoSync and scoring are outside v0.15.120 scope.\n- Repository CI proves these structural contracts, not final Electron appearance. Require post-update Windows evidence before marking the visual issue accepted.\n`;
          if(!a.includes('## v0.15.120 DATA submenu baseline'))a+=rule;fs.writeFileSync(ap,a);

          const cp='docs/continuity-manual.json';const c=JSON.parse(fs.readFileSync(cp,'utf8'));
          c.real_world_validation=c.real_world_validation||{};
          c.real_world_validation.data_patch_notes_subnav_v015120={
            status:'pending',
            evidence:'Repository structural/regression audits pass only after activation; a post-v0.15.120 real-Windows screenshot is still required for visual acceptance.',
            must_verify:[
              'DATA submenu spans the full tier/detail workspace rather than only the right detail column',
              'Patch Notes hides the role-tier browser and uses the full DATA workspace',
              'Champion Tier List restores the normal tier/detail split',
              'Patch Notes champion cards remain compact and readable'
            ]
          };
          c.next_planned_work={
            version:'0.15.121',
            theme:'SAFE MODE / CRASH-LOOP ISOLATION',
            status:'planned',
            intent:'If a module repeatedly breaks startup or runtime readiness, isolate the failing optional subsystem and boot a minimal usable app instead of making the entire application unavailable.',
            guardrails:[
              'preserve v0.15.115 single-owner UI and v0.15.120 DATA submenu contract',
              'preserve v0.15.116 transactional rollback',
              'preserve v0.15.117 state integrity',
              'preserve v0.15.118 lifecycle disposal',
              'preserve v0.15.119 AutoSync concurrency guards',
              'do not change recommendation or Random scoring unless explicitly requested'
            ]
          };
          fs.writeFileSync(cp,JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Sync continuity snapshot
        run: |
          node tools/sync-current-state.js
          node tools/ai-continuity-audit.js
      - name: Post-activation audits
        run: |
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01579-audit.js
          node tools/ai-continuity-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md AGENTS.md docs/continuity-manual.json docs/CURRENT_STATE.md update/current-state.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.120 data submenu restore'
            git push
          fi
