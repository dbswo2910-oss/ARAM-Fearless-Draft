name: ARAM Rating v0.2 Real-Data Research Audit

on:
  push:
    branches: [ research/aram-rating-v02-real-data ]
    paths:
      - 'research/aram-rating-v01/**'
      - 'research/aram-rating-v02/**'
      - 'tools/aram-rating-v01-audit.py'
      - 'tools/aram-rating-v02-audit.py'
      - '.github/workflows/aram-rating-v02-real-data-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'research/aram-rating-v01/**'
      - 'research/aram-rating-v02/**'
      - 'tools/aram-rating-v01-audit.py'
      - 'tools/aram-rating-v02-audit.py'
      - '.github/workflows/aram-rating-v02-real-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research modules
        run: python -m py_compile research/aram-rating-v01/*.py research/aram-rating-v02/*.py tools/aram-rating-v01-audit.py tools/aram-rating-v02-audit.py
      - name: Re-run v0.1 baseline audit
        run: python tools/aram-rating-v01-audit.py
      - name: Run v0.2 data/evaluation/report audit
        run: python tools/aram-rating-v02-audit.py
      - name: Assert CI does not fabricate real data
        run: |
          python - <<'PY'
          import json
          r=json.load(open('audit-output/aram-rating-v02-report.json',encoding='utf-8'))
          assert r['real_kr_matches_in_ci']==0
          assert r['real_data_conclusion']=='insufficient_real_data'
          print('real-data guard: PASS')
          PY
      - name: Upload research audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aram-rating-v02-research-audit
          path: |
            audit-output/aram-rating-v01-report.json
            audit-output/aram-rating-v02-report.json
          if-no-files-found: error
