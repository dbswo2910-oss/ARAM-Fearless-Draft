name: v0.16.0 Post-Activation Regression

on:
  push:
    branches:
      - release/v0160-production-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm production remains Golden
        run: node -e "const m=require('./update/manifest.json'); if(m.version!=='0.15.135') throw new Error('production manifest drift '+m.version); console.log('PRODUCTION GOLDEN UNCHANGED',m.version)"
      - name: Reconfirm canonical production owner integration
        run: |
          node tools/stability/v0160-candidate-manifest.js
          node tools/stability/canonical-production-owner-audit.js
          node tools/stability/production-runtime-integration-audit.js
      - name: Materialize and syntax-check actual v0.16 candidate
        run: node tools/stability/materialize-v0160-candidate.js --out audit-output/stability/post-activation/candidate-app
      - name: Candidate State and Research compatibility
        run: node tools/stability/post-activation-state-compat-audit.js
      - name: Behavioral differential against Golden
        run: node tools/stability/behavioral-differential-audit.js
      - name: AutoSync updater lifecycle soak
        run: node tools/stability/autosync-updater-lifecycle-soak-audit.js
      - name: Existing full regression core
        run: node tools/full-regression-audit.js
      - name: AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload core post-activation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-post-activation-core
          path: |
            audit-output/stability
            audit-output/full-regression-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: warn

  candidate-windows-installed:
    runs-on: windows-latest
    timeout-minutes: 35
    needs: candidate-core-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize actual v0.16 installed candidate
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'aram-v0160-candidate'
          node tools/stability/materialize-v0160-candidate.js --out "$candidate"
          if ($LASTEXITCODE -ne 0) { throw 'v0.16 candidate materialization failed' }
          Get-ChildItem $candidate -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "candidate JS syntax failed: $($_.FullName)" }
          }
          "V0160_CANDIDATE_APP=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify pinned Electron runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64'
          $uri = 'https://github.com/electron/electron/releases/download/v38.7.2/electron-v38.7.2-win32-x64.zip'
          $expected = '0401b898a8d83523694bd0afa6dc3035a54c57404a914725baa621c3378b5885'
          $ok = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile $zip
              $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expected) { throw "Electron ZIP hash mismatch: $hash" }
              $ok=$true; break
            } catch {
              Write-Warning "Electron download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds (8*$attempt) }
            }
          }
          if (-not $ok) { throw 'Pinned Electron download failed' }
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          Expand-Archive $zip $runtime -Force
          $exe=Join-Path $runtime 'electron.exe'
          if (!(Test-Path $exe)) { throw 'Electron executable missing' }
          if (((& $exe --version | Out-String).Trim()) -ne 'v38.7.2') { throw 'Electron version mismatch' }
          "PINNED_ELECTRON_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PINNED_ELECTRON_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Two-cycle installed Windows cold-start and persistence
        shell: pwsh
        run: |
          $outDir=Join-Path $PWD 'audit-output\stability\post-activation\windows'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $electron=$env:PINNED_ELECTRON_EXE
          $appDir=$env:V0160_CANDIDATE_APP
          $roaming=[Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          $stable=Join-Path $roaming 'aram-fearless-draft'
          if (Test-Path $stable) { Remove-Item $stable -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stable | Out-Null
          $marker=Join-Path $stable 'v0160-post-activation-persistence.marker'
          function Run-Cycle([int]$cycle) {
            $stdout=Join-Path $outDir "cycle-$cycle-stdout.log"
            $stderr=Join-Path $outDir "cycle-$cycle-stderr.log"
            $before=@(Get-Process electron -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
            $parent=Start-Process -FilePath $electron -ArgumentList @("$appDir",'--aram-v0160-post-activation') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            Start-Sleep -Seconds 15
            $after=@(Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $before -notcontains $_.Id })
            $alive=($after.Count -gt 0) -or (-not $parent.HasExited)
            $outText=if(Test-Path $stdout){Get-Content $stdout -Raw}else{''}
            $errText=if(Test-Path $stderr){Get-Content $stderr -Raw}else{''}
            $storage=($outText -match '\[v0\.16\.0 storage-root\]') -and ($outText -match 'aram-fearless-draft')
            $fatal=($errText -match 'App threw an error') -or ($errText -match 'Cannot find module') -or ($errText -match 'canonical owner registry is not production-active')
            foreach($proc in $after){ try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {} }
            try { if(-not $parent.HasExited){Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue} } catch {}
            return [ordered]@{cycle=$cycle;alive_after_15s=$alive;storage_identity_logged=$storage;fatal_load_error=$fatal;stdout_bytes=(if(Test-Path $stdout){(Get-Item $stdout).Length}else{0});stderr_bytes=(if(Test-Path $stderr){(Get-Item $stderr).Length}else{0})}
          }
          $one=Run-Cycle 1
          if (-not $one.alive_after_15s -or -not $one.storage_identity_logged -or $one.fatal_load_error) { throw "v0.16 Windows cycle 1 failed: $($one | ConvertTo-Json -Compress)" }
          Set-Content -Path $marker -Value 'persist-v0160' -Encoding utf8
          $two=Run-Cycle 2
          $markerPersisted=(Test-Path $marker) -and ((Get-Content $marker -Raw) -match 'persist-v0160')
          $canonicalRegistry=Test-Path (Join-Path $appDir 'canonical\src\core\owner-registry.js')
          $success=$two.alive_after_15s -and $two.storage_identity_logged -and (-not $two.fatal_load_error) -and $markerPersisted -and $canonicalRegistry
          $report=[ordered]@{
            status=if($success){'SUCCESS'}else{'FAILURE'}
            stage='V0160_POST_ACTIVATION_WINDOWS_INSTALLED'
            candidate_version='0.16.0'
            windows_runner=$true
            electron_version='38.7.2'
            electron_runtime_sha256=$env:PINNED_ELECTRON_SHA256
            stable_user_data_identity='aram-fearless-draft'
            canonical_registry_materialized=$canonicalRegistry
            restart_cycles=2
            persistence_marker_preserved=$markerPersisted
            cycle_1=$one
            cycle_2=$two
            production_manifest_mutated=$false
            real_league_client_tested=$false
            real_research_159_retest=$false
            physical_evidence_reused_as_prior_release_evidence=$true
            scope='GitHub-hosted Windows candidate cold-start + restart persistence; physical League/LCU and exact Research 159 evidence remains the separately validated user-PC gate.'
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $outDir 'windows-installed-report.json') -Encoding utf8
          if (-not $success) { throw "v0.16 Windows installed acceptance failed: $($report | ConvertTo-Json -Compress -Depth 6)" }
          Write-Host 'V0.16 POST-ACTIVATION WINDOWS INSTALLED: SUCCESS'
      - name: Upload Windows post-activation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-post-activation-windows
          path: audit-output/stability/post-activation/windows
          if-no-files-found: warn
