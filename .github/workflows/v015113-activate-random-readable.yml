name: v0.15.113 Activate RANDOM Readable Workspace

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015113-activate-random-readable.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015113-random-readable-audit.js
          node tools/v015112-random-workspace-stability-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.113 manifest + docs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          m.version='0.15.113';
          m.message='v0.15.113 · RANDOM READABILITY HOTFIX — remove narrow right rail; decision area gets full usable width';
          const remove=new Set(['random-workspace-readable-v015113.js','runtime-source-stability-v015113.js','main-v015113.js']);
          m.files=(m.files||[]).filter(x=>!remove.has(x.path));
          const pkg=m.files.find(x=>x.path==='package.json');
          if(!pkg)throw new Error('manifest package.json missing');
          pkg.source='update/v0.15.113/package.json';
          let idx=m.files.findIndex(x=>x.path==='random-workspace-stability-v015112.js');
          if(idx<0)throw new Error('v0.15.112 RANDOM workspace anchor missing');
          m.files.splice(idx+1,0,{path:'random-workspace-readable-v015113.js',source:'update/v0.15.113/random-workspace-readable-v015113.js'});
          idx=m.files.findIndex(x=>x.path==='runtime-source-stability-v015112.js');
          if(idx<0)throw new Error('v0.15.112 runtime anchor missing');
          m.files.splice(idx+1,0,{path:'runtime-source-stability-v015113.js',source:'update/v0.15.113/runtime-source-stability-v015113.js'});
          idx=m.files.findIndex(x=>x.path==='main-v015112.js');
          if(idx<0)throw new Error('v0.15.112 main anchor missing');
          m.files.splice(idx+1,0,{path:'main-v015113.js',source:'update/v0.15.113/main-v015113.js'});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';
          let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.113**');
          const note='- **v0.15.113**: RANDOM readability hotfix. Removes the screenshot-confirmed microscopic third rail by switching PICK to a stable two-column workbench and placing Combination DNA / selected-composition detail below the main column at usable width. Scoring is unchanged.';
          if(!r.includes('**v0.15.113**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.113**');
          const hnote='\n### v0.15.113 — RANDOM readability hotfix\n\nScreenshot after v0.15.112 proved that the three-column PICK layout still allowed the decision rail to become microscopic in the real Electron viewport. v0.15.113 removes that failure mode instead of trying another narrow-rail tweak: the outer PICK workbench is always two columns on desktop (team input + main work area), and Combination DNA / selected-composition detail live below the main column with full usable width. The v0.15.111 rail CSS is explicitly neutralized while its compatibility classes are retained. PICK/IN GAME isolation and v0.15.79 safety lineage remain intact. Recommendation/scoring logic is unchanged. `score_logic_changed:false`.\n';
          if(!h.includes('### v0.15.113 — RANDOM readability hotfix'))h+=hnote;
          fs.writeFileSync(hp,h);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015113-random-readable-audit.js
          node tools/v015112-random-workspace-stability-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.113 random readability hotfix'
            git push
          fi
