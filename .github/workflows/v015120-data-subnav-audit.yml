name: v0.15.120 DATA Patch Notes Submenu Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'update/v0.15.120/**'
      - 'tools/v015120-data-subnav-audit.js'
      - '.github/workflows/v015120-data-subnav-audit.yml'
      - '.github/workflows/v015120-activate-data-subnav.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'update/v0.15.120/**'
      - 'tools/v015120-data-subnav-audit.js'
      - '.github/workflows/v015120-data-subnav-audit.yml'
      - '.github/workflows/v015120-activate-data-subnav.yml'
      - 'docs/continuity-manual.json'
      - 'tools/sync-current-state.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.120 DATA submenu audit
        run: node tools/v015120-data-subnav-audit.js
      - name: Run v0.15.119 AutoSync concurrency audit
        run: node tools/v015119-autosync-concurrency-audit.js
      - name: Run v0.15.115 single-owner UI audit
        run: node tools/v015115-single-owner-stability-audit.js
      - name: Run AI continuity audit
        run: node tools/ai-continuity-audit.js
      - name: Upload v0.15.120 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015120-data-subnav-report
          path: audit-output/v015120-data-subnav-report.json
          if-no-files-found: error
