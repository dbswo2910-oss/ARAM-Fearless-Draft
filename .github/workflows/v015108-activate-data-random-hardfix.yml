name: v0.15.108 Activate DATA RANDOM Hardfix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v015108-activate-data-random-hardfix.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-activation audits
        run: |
          node tools/v015108-data-random-hardfix-audit.js
          node tools/v015107-view-boundary-audit.js
          node tools/full-regression-audit.js
      - name: Activate v0.15.108 manifest + docs
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mp='update/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          m.version='0.15.108';
          m.message='v0.15.108 · DATA PATCH MODE HARD FIX — hides the tier browser whenever Patch Notes is active and strengthens Random Practice foreign-DATA quarantine';
          const remove=new Set(['data-random-hardfix-v015108.js','runtime-source-stability-v015108.js','main-v015108.js']);
          m.files=(m.files||[]).filter(x=>!remove.has(x.path));
          const pkg=m.files.find(x=>x.path==='package.json');
          if(!pkg)throw new Error('manifest package.json missing');
          pkg.source='update/v0.15.108/package.json';
          let idx=m.files.findIndex(x=>x.path==='view-boundary-repair-v015107.js');
          if(idx<0)throw new Error('v0.15.107 UI anchor missing');
          m.files.splice(idx+1,0,{path:'data-random-hardfix-v015108.js',source:'update/v0.15.108/data-random-hardfix-v015108.js'});
          idx=m.files.findIndex(x=>x.path==='runtime-source-stability-v015107.js');
          if(idx<0)throw new Error('v0.15.107 runtime anchor missing');
          m.files.splice(idx+1,0,{path:'runtime-source-stability-v015108.js',source:'update/v0.15.108/runtime-source-stability-v015108.js'});
          idx=m.files.findIndex(x=>x.path==='main-v015107.js');
          if(idx<0)throw new Error('v0.15.107 main anchor missing');
          m.files.splice(idx+1,0,{path:'main-v015108.js',source:'update/v0.15.108/main-v015108.js'});
          fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');

          const rp='README.md';
          let r=fs.readFileSync(rp,'utf8');
          r=r.replace(/Current app\/update version: \*\*v[^*]+\*\*/,'Current app/update version: **v0.15.108**');
          const note='- **v0.15.108**: deterministic Patch Notes mode hardfix. The tier browser is hidden from the actual Data branch whenever Patch Notes is active; Random Practice also quarantines foreign Data branches. Scoring unchanged.';
          if(!r.includes('**v0.15.108**'))r+='\n'+note+'\n';
          fs.writeFileSync(rp,r);

          const hp='docs/AI_HANDOFF.md';
          let h=fs.readFileSync(hp,'utf8');
          h=h.replace(/- Active updater version: \*\*v[^*]+\*\*/,'- Active updater version: **v0.15.108**');
          const hnote='\n### v0.15.108 — DATA Patch Mode hardfix\n\nThe screenshot-confirmed v0.15.107 failure was caused by relying on a direct-child layout assumption and a single patch-mode signal. v0.15.108 detects Patch Notes from visible and hidden tabs, the v0.15.99 card class, and actual patch-note visibility, then marks and hides the real tier branch using descendant-safe selectors. Random Practice also hides foreign Data nodes and their empty branches. `score_logic_changed:false`.\n';
          if(!h.includes('### v0.15.108 — DATA Patch Mode hardfix'))h+=hnote;
          fs.writeFileSync(hp,h);
          NODE
      - name: Post-activation audits
        run: |
          node tools/v015108-data-random-hardfix-audit.js
          node tools/v015107-view-boundary-audit.js
          node tools/full-regression-audit.js
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/manifest.json README.md docs/AI_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.108 Data patch-mode hardfix'
            git push
          fi
