name: v0.15.97 IN GAME Results Parser Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.97 result parser audit
        run: node tools/ingame-results-parser-v01597-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-results-parser-v01597-report
          path: audit-output/ingame-results-parser-v01597-report.json
          if-no-files-found: error
