name: v0.15.95 IN GAME Results Audit

on:
  push:
    branches: [ main, 'feat/v0.15.95-ingame-results' ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/ingame-results-v01595-audit.js
