name: v0.16.0 Installed Persistence Acceptance

on:
  push:
    branches:
      - stability/v0160-clean-baseline-phaseb
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-persistence-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore validated v0.15.49 installed baseline
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD 'audit-output\stability\installed-persistence'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'aram-base-v0142.zip'
          $uri = 'https://github.com/dbswo2910-oss/ARAM-Fearless-Draft/releases/download/v0.14.2/ARAM_Fearless_Draft_appbundle_v0.14.2.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $bundleHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleHash -ne '2e076de26edb8f20a54bf0e07cfce9b6102f5f97617d8c5a3f65a03cb5671d04') { throw "base bundle SHA-256 mismatch: $bundleHash" }

          $extract = Join-Path $env:RUNNER_TEMP 'aram-persistence-base-extracted'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $candidates = Get-ChildItem $extract -Recurse -Filter package.json | Where-Object {
            (Test-Path (Join-Path $_.Directory.FullName 'index.html')) -and (Test-Path (Join-Path $_.Directory.FullName 'main.js'))
          }
          if (-not $candidates) { throw 'could not locate base app root containing package.json/index.html/main.js' }
          $base = ($candidates | Sort-Object { $_.FullName.Length } | Select-Object -First 1).Directory.FullName
          $baseIndex = Join-Path $base 'index.html'
          $sourceIndexHash = (Get-FileHash $baseIndex -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceIndexHash -ne '4a6cc26334e2dd7dd4aaf7ce5bd15315e47ad173baeb134ac40019d2e4906f32') { throw "v0.14.2 index SHA-256 mismatch: $sourceIndexHash" }

          $fixtureDir = Join-Path $PWD 'tools\stability\fixtures'
          $fixtureMeta = Get-Content (Join-Path $fixtureDir 'index-v0142-to-v01549.fixture.json') -Raw | ConvertFrom-Json
          $parts = @(Get-ChildItem $fixtureDir -Filter 'index-v0142-to-v01549.zst.b64.part*' | Sort-Object Name)
          if ($parts.Count -ne 7) { throw "expected 7 v0.15.49 index delta parts, found $($parts.Count)" }
          $base64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '') -replace '\s',''
          $patch = Join-Path $env:RUNNER_TEMP 'index-v0142-to-v01549.zstpatch'
          [IO.File]::WriteAllBytes($patch,[Convert]::FromBase64String($base64))
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '194d5ec7ed88418a468f9da1a5b04b0f5d604564813fae271cf30864b9582c24') { throw "index delta SHA-256 mismatch: $patchHash" }
          if ($fixtureMeta.source_index_sha256 -ne $sourceIndexHash -or $fixtureMeta.patch_sha256 -ne $patchHash) { throw 'index fixture metadata mismatch' }
          & zstd --version
          if ($LASTEXITCODE -ne 0) { throw 'zstd is unavailable on the Windows runner' }
          $rebuilt = Join-Path $env:RUNNER_TEMP 'index-v01549-rebuilt.html'
          & zstd -d "--patch-from=$baseIndex" $patch -o $rebuilt
          if ($LASTEXITCODE -ne 0) { throw "v0.15.49 index reconstruction failed: $LASTEXITCODE" }
          $targetIndexHash = (Get-FileHash $rebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetIndexHash -ne '8de7a8eb03e363b808439d48673a4808809d82db67bc1b7955e80414a8782906') { throw "rebuilt v0.15.49 index SHA-256 mismatch: $targetIndexHash" }
          Move-Item -Path $rebuilt -Destination $baseIndex -Force

          $coreParts = @(Get-ChildItem $fixtureDir -Filter 'autosync-core-v01549.zst.b64.part*' | Sort-Object Name)
          if ($coreParts.Count -ne 4) { throw "expected 4 v0.15.49 AutoSync core fixture parts, found $($coreParts.Count)" }
          $coreBase64 = (($coreParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '') -replace '\s',''
          $coreZst = Join-Path $env:RUNNER_TEMP 'autosync-core-v01549.zst'
          [IO.File]::WriteAllBytes($coreZst,[Convert]::FromBase64String($coreBase64))
          $coreZstHash = (Get-FileHash $coreZst -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($coreZstHash -ne 'abf29e3738ca5c1f81e5d1f0aaab0ae7df5bdb19da4a260536626734ed8dd80e') { throw "v0.15.49 AutoSync fixture SHA-256 mismatch: $coreZstHash" }
          $coreRestored = Join-Path $env:RUNNER_TEMP 'autosync-core-v01549.js'
          & zstd -d $coreZst -o $coreRestored
          if ($LASTEXITCODE -ne 0) { throw "v0.15.49 AutoSync core reconstruction failed: $LASTEXITCODE" }
          $coreHash = (Get-FileHash $coreRestored -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($coreHash -ne 'a9f206df445d06eefc99ae55f1ceb3a7a5ff108a40a8393fa75ec413d2c4aba6') { throw "restored v0.15.49 AutoSync core SHA-256 mismatch: $coreHash" }
          Move-Item -Path $coreRestored -Destination (Join-Path $base 'autosync-core.js') -Force

          $installed = Join-Path $env:RUNNER_TEMP 'aram-persistence-installed'
          if (Test-Path $installed) { Remove-Item $installed -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          Get-ChildItem -LiteralPath $base -Force | Copy-Item -Destination $installed -Recurse -Force
          $roaming = [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          $stableUserData = Join-Path $roaming 'aram-fearless-draft'
          if (Test-Path $stableUserData) { Remove-Item $stableUserData -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stableUserData | Out-Null
          "INSTALLED_APP=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STABLE_USER_DATA=$stableUserData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{status='SUCCESS';stage='PERSISTENCE_BASELINE_READY';bundle_sha256=$bundleHash;restored_index_sha256=$targetIndexHash;restored_autosync_core_sha256=$coreHash;restored_installed_baseline='0.15.49';installed_app=$installed;stable_user_data=$stableUserData} | ConvertTo-Json | Set-Content -Path (Join-Path $outDir 'baseline.json') -Encoding utf8

      - name: Download and verify pinned Electron runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'electron-v38.7.2-win32-x64'
          $uri = 'https://github.com/electron/electron/releases/download/v38.7.2/electron-v38.7.2-win32-x64.zip'
          $expected = '0401b898a8d83523694bd0afa6dc3035a54c57404a914725baa621c3378b5885'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile $zip
              $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expected) { throw "Electron ZIP SHA-256 mismatch: $hash" }
              $downloaded = $true
              break
            } catch {
              Write-Warning "Electron download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
          }
          if (-not $downloaded) { throw 'Pinned Electron download failed after 3 attempts' }
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $runtime -Force
          $electron = Join-Path $runtime 'electron.exe'
          if (!(Test-Path $electron)) { throw "Electron binary missing after extract: $electron" }
          $electronVersion = (& $electron --version | Out-String).Trim()
          if ($electronVersion -ne 'v38.7.2') { throw "Electron version probe mismatch: $electronVersion" }
          "PINNED_ELECTRON_EXE=$electron" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PINNED_ELECTRON_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed synthetic installed user state before current update
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'audit-output\stability\installed-persistence\probe-seed.json'
          $probe = Join-Path $PWD 'tools\stability\windows-persistence-probe.js'
          $stdout = Join-Path $PWD 'audit-output\stability\installed-persistence\probe-seed-stdout.log'
          $stderr = Join-Path $PWD 'audit-output\stability\installed-persistence\probe-seed-stderr.log'
          $p = Start-Process -FilePath $env:PINNED_ELECTRON_EXE -ArgumentList @($probe,'--mode','seed','--app-dir',$env:INSTALLED_APP,'--user-data',$env:STABLE_USER_DATA,'--report',$report) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          if (!(Test-Path $report)) { throw "pre-upgrade persistence seed report missing; exit=$($p.ExitCode)" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or $r.status -ne 'SUCCESS' -or $r.research_checkpoint_matches -ne 159 -or -not $r.local_storage_exact -or -not $r.research_checkpoint_exact -or -not $r.research_latest_run_exact) { throw "pre-upgrade persistence seed verification failed; exit=$($p.ExitCode); status=$($r.status)" }

      - name: Apply current manifest in place
        shell: pwsh
        run: |
          node tools/stability/materialize-installed-app.js --base "$env:INSTALLED_APP" --out "$env:INSTALLED_APP" --in-place
          if ($LASTEXITCODE -ne 0) { throw 'in-place current materialization failed' }
          $manifest = Get-Content (Join-Path $PWD 'update\manifest.json') -Raw | ConvertFrom-Json
          $expectedVersion = [string]$manifest.version
          $pkg = Get-Content (Join-Path $env:INSTALLED_APP 'package.json') -Raw | ConvertFrom-Json
          if ([string]$pkg.version -ne $expectedVersion) { throw "installed package version $($pkg.version) != manifest $expectedVersion" }
          "EXPECTED_APP_VERSION=$expectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem "$env:INSTALLED_APP\canonical-shadow\src" -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "canonical Windows syntax failed: $($_.FullName)" }
          }

      - name: Boot current app twice and prove user state survives each restart
        shell: pwsh
        run: |
          $electron = $env:PINNED_ELECTRON_EXE
          $outDir = Join-Path $PWD 'audit-output\stability\installed-persistence'
          $probe = Join-Path $PWD 'tools\stability\windows-persistence-probe.js'
          $activeVersion = if ($env:EXPECTED_APP_VERSION) { $env:EXPECTED_APP_VERSION } else { [string](Get-Content (Join-Path $env:INSTALLED_APP 'package.json') -Raw | ConvertFrom-Json).version }
          function Run-Current([int]$cycle) {
            $stdout = Join-Path $outDir "current-cycle-$cycle-stdout.log"
            $stderr = Join-Path $outDir "current-cycle-$cycle-stderr.log"
            $p = Start-Process -FilePath $electron -ArgumentList @("$env:INSTALLED_APP", '--aram-launcher-cold-start') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            Start-Sleep -Seconds 12
            $alive = -not $p.HasExited
            $exitCode = if ($p.HasExited) { $p.ExitCode } else { $null }
            $stdoutText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $stderrText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            $storageIdentityLogged = ($stdoutText -match 'storage-root') -and ($stdoutText -match 'aram-fearless-draft')
            $fatal = ($stderrText -match 'App threw an error') -or ($stderrText -match 'index contract mismatch') -or ($stderrText -match 'UnhandledPromiseRejection')
            if ($alive) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $alive) { throw "Current v$activeVersion cycle $cycle exited early; code=$exitCode" }
            if (-not $storageIdentityLogged) { throw "Current v$activeVersion cycle $cycle did not log stable storage identity" }
            if ($fatal) { throw "Current v$activeVersion cycle $cycle reported a fatal load error" }
            Start-Sleep -Seconds 2
          }
          function Verify-State([int]$cycle) {
            $report = Join-Path $outDir "probe-verify-$cycle.json"
            $stdout = Join-Path $outDir "probe-verify-$cycle-stdout.log"
            $stderr = Join-Path $outDir "probe-verify-$cycle-stderr.log"
            $p = Start-Process -FilePath $electron -ArgumentList @($probe,'--mode','verify','--app-dir',$env:INSTALLED_APP,'--user-data',$env:STABLE_USER_DATA,'--report',$report) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            if (!(Test-Path $report)) { throw "persistence verify cycle $cycle report missing; exit=$($p.ExitCode)" }
            $r = Get-Content $report -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or $r.status -ne 'SUCCESS' -or $r.research_checkpoint_matches -ne 159 -or -not $r.local_storage_exact -or -not $r.research_checkpoint_exact -or -not $r.research_latest_run_exact) { throw "persistence verify cycle $cycle mismatch; exit=$($p.ExitCode); status=$($r.status)" }
          }
          Run-Current 1
          Verify-State 1
          Run-Current 2
          Verify-State 2

          $roaming = [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          $stableMirror = Join-Path $env:STABLE_USER_DATA 'state-integrity-v015117\mirrors\renderer-local-storage.json'
          $goldenFallbackMirror = Join-Path $roaming 'ARAM Fearless Draft\state-integrity-v015117\mirrors\renderer-local-storage.json'
          $mirror = @($stableMirror,$goldenFallbackMirror) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mirror) { throw "renderer localStorage mirror missing after current boots; checked stable=$stableMirror fallback=$goldenFallbackMirror" }
          $mirrorLocation = if ([IO.Path]::GetFullPath($mirror).StartsWith([IO.Path]::GetFullPath($env:STABLE_USER_DATA),[StringComparison]::OrdinalIgnoreCase)) { 'stable-userData' } else { 'golden-preload-fallback' }
          $m = Get-Content $mirror -Raw | ConvertFrom-Json
          $fixtureEntry = $m.payload.entries.'aram_v0160_persistence_fixture_v1'
          $favoritesEntry = $m.payload.entries.'aram_match_lab_favorites_v1'
          if (-not $fixtureEntry -or $fixtureEntry.deleted -or -not $favoritesEntry -or $favoritesEntry.deleted) { throw 'state-integrity mirror did not preserve tracked fixture keys' }
          $expectedFixture = '{"schema":1,"marker":"v0160-installed-persistence","count":159,"synthetic":true}'
          if ($fixtureEntry.value -ne $expectedFixture) { throw 'state-integrity mirror fixture payload drift' }

          [ordered]@{
            status='SUCCESS'
            stage='INSTALLED_WINDOWS_PERSISTENCE_AFTER_TWO_RESTARTS'
            baseline='0.15.49'
            golden_baseline='0.15.135'
            active_version=$activeVersion
            electron_version='38.7.2'
            electron_runtime_sha256=$env:PINNED_ELECTRON_SHA256
            local_storage_preserved=$true
            state_integrity_mirror_preserved=$true
            state_integrity_mirror_path=$mirror
            state_integrity_mirror_location=$mirrorLocation
            research_database='aram-rating-research-v03'
            research_checkpoint_key='checkpoint-v03'
            research_checkpoint_matches=159
            research_checkpoint_preserved=$true
            derived_cache_preserved=$true
            restart_cycles=2
            synthetic_fixture=$true
            personal_data_in_fixture=$false
            production_manifest_unchanged=$true
            real_league_client_tested=$false
          } | ConvertTo-Json | Set-Content -Path (Join-Path $outDir 'installed-persistence-report.json') -Encoding utf8

      - name: Upload installed persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0160-installed-persistence-acceptance
          path: audit-output/stability/installed-persistence
          if-no-files-found: error
