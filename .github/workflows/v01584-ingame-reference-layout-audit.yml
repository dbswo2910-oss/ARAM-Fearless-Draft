name: v0.15.84 IN GAME Reference Layout Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run IN GAME reference-layout audit
        run: node tools/ingame-reference-layout-v01584-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-reference-layout-v01584-report
          path: audit-output/ingame-reference-layout-v01584-report.json
          if-no-files-found: error
