name: v0.15.119 AutoSync Concurrency Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v0.15.119 AutoSync concurrency audit
        run: node tools/v015119-autosync-concurrency-audit.js
      - name: Run v0.15.118 resource lifecycle audit
        run: node tools/v015118-resource-lifecycle-audit.js
      - name: Run v0.15.117 state integrity audit
        run: node tools/v015117-state-integrity-audit.js
      - name: Run v0.15.116 runtime/update stability audit
        run: node tools/v015116-runtime-update-stability-audit.js
      - name: Run v0.15.115 single-owner UI stability audit
        run: node tools/v015115-single-owner-stability-audit.js
      - name: Run full regression audit
        run: node tools/full-regression-audit.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015119-autosync-concurrency-audit
          path: audit-output/v015119-autosync-concurrency-report.json
          if-no-files-found: ignore
