name: v0.15.89 RANDOM Pick Command Center Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run RANDOM pick command center audit
        run: node tools/random-pick-command-center-v01589-audit.js
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-pick-command-center-v01589-report
          path: audit-output/random-pick-command-center-v01589-report.json
          if-no-files-found: error
