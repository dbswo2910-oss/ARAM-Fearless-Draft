name: v0.15.122 Activate Riot Grade Accuracy Retry

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/v015122-successor-grade-audit-contract.js'
      - '.github/workflows/v015122-activate-riot-grade-accuracy-retry.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/v015122-successor-grade-audit-contract.js'
      - '.github/workflows/v015122-activate-riot-grade-accuracy-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate historical successor-contract anchors
        run: node tools/v015122-successor-grade-audit-contract.js --check
      - name: Re-run v0.15.122 preactivation audit
        run: node tools/v015122-riot-grade-accuracy-audit.js
      - name: Re-run full regression on unchanged v0.15.121 manifest
        run: node tools/full-regression-audit.js

  activate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify retry preconditions
        run: |
          node tools/v015122-successor-grade-audit-contract.js --check
          node tools/v015122-riot-grade-accuracy-audit.js
          node tools/v015121-random-practice-restore-audit.js
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01579-audit.js
          node tools/ai-continuity-audit.js
          node tools/full-regression-audit.js
      - name: Upgrade historical Riot-grade successor contracts
        run: node tools/v015122-successor-grade-audit-contract.js --apply
      - name: Prepare v0.15.122 activation files
        run: node tools/v015122-activate-riot-grade-accuracy.js
      - name: Sync repository continuity snapshot
        run: |
          node tools/sync-current-state.js
          node tools/ai-continuity-audit.js
      - name: Post-activation Riot Grade and predecessor audits
        run: |
          node tools/v015122-riot-grade-accuracy-audit.js
          node tools/v015121-random-practice-restore-audit.js
          node tools/v015120-data-subnav-audit.js
          node tools/v015119-autosync-concurrency-audit.js
          node tools/v015118-resource-lifecycle-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015115-single-owner-stability-audit.js
          node tools/runtime-stability-v01579-audit.js
          node tools/ai-continuity-audit.js
      - name: Full regression after active-manifest mutation
        run: node tools/full-regression-audit.js
      - name: Commit verified activation atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/v015117-state-integrity-audit.js \
            tools/v015118-resource-lifecycle-audit.js \
            update/manifest.json README.md AGENTS.md docs/AI_HANDOFF.md docs/KNOWN_ISSUES.md \
            docs/continuity-manual.json docs/CURRENT_STATE.md update/current-state.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'release v0.15.122 riot grade accuracy'
            git push
          fi
