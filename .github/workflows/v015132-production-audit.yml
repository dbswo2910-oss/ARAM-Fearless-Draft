name: v0.15.132 Historical Production Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current continuity
        run: |
          node tools/sync-current-state.js --check
          node tools/ai-continuity-audit.js
      - name: Preserve historical v0.15.132 audit source
        run: |
          node -c tools/v015132-production-audit.js
          echo 'Historical exact-version audit is manual-only because v0.15.132 is superseded by the real-Windows follow-up.'
