name: ARAM Rating Research UI v0.1 Audit

on:
  push:
    branches: [ research/aram-rating-ui-v01 ]
    paths:
      - 'research/aram-rating-ui-v01/**'
      - 'tools/aram-rating-ui-v01-audit.js'
      - '.github/workflows/aram-rating-ui-v01-audit.yml'
  pull_request:
    branches: [ research/aram-rating-v03-network-expansion, main ]
    paths:
      - 'research/aram-rating-ui-v01/**'
      - 'tools/aram-rating-ui-v01-audit.js'
      - '.github/workflows/aram-rating-ui-v01-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile Research UI JavaScript
        run: |
          node -c research/aram-rating-ui-v01/rating-engine-v01.js
          node -c research/aram-rating-ui-v01/research-ui-core.js
          node -c research/aram-rating-ui-v01/research-ui-devtools.js
          node -c tools/aram-rating-ui-v01-audit.js
      - name: Run Research UI fixtures
        run: |
          node research/aram-rating-ui-v01/research-ui-core.test.js
          node research/aram-rating-ui-v01/research-ui-failsafe.test.js
          node tools/aram-rating-ui-v01-audit.js
      - name: Re-run Phase B safety fixtures
        run: |
          node research/aram-rating-v03/collector-core.test.js
          node tools/aram-rating-v03-static-audit.js
      - name: Run Full Regression
        run: node tools/full-regression-audit.js
      - name: Run Player Profile regression
        run: node tools/profile-ux-audit.js
      - name: Run Match History regression
        run: node tools/v015128-history-latency-audit.js
      - name: Run AutoSync regression
        run: node tools/v015119-autosync-concurrency-audit.js
      - name: Run RANDOM regression
        run: |
          node tools/v015121-random-practice-restore-audit.js
          node tools/random-pick-preview-lock-v015100-audit.js
      - name: Run DATA regression
        run: node tools/v015120-data-subnav-audit.js
      - name: Run Item regression
        run: node tools/item-recommendation-v01581-audit.js
      - name: Run update and ownership safety
        run: |
          node tools/v015115-single-owner-stability-audit.js
          node tools/v015116-runtime-update-stability-audit.js
          node tools/v015117-state-integrity-audit.js
          node tools/v015118-resource-lifecycle-audit.js
      - name: Run AI continuity
        run: node tools/ai-continuity-audit.js
      - name: Upload Research UI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aram-rating-ui-v01-audit
          path: |
            audit-output/aram-rating-ui-v01-report.json
            audit-output/full-regression-report.json
            audit-output/profile-ux-report.json
            audit-output/v015128-history-latency-report.json
            audit-output/v015119-autosync-concurrency-report.json
            audit-output/v015121-random-practice-restore-report.json
            audit-output/v015120-data-subnav-report.json
            audit-output/v015116-runtime-update-stability-report.json
            audit-output/ai-continuity-report.json
          if-no-files-found: warn
