name: v0.15.93 RANDOM Pick Interaction Audit

on:
  push:
    branches: [ main, 'fix/v0.15.93-random-pick-interaction-hotfix' ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/random-pick-interaction-v01593-audit.js
