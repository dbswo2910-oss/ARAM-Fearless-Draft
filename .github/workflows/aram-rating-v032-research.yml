name: ARAM Rating v0.3.2 Research

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'research/aram-rating-v032/**'
      - 'src/research/**'
      - 'tools/research/aram-rating-v032-audit.js'
      - 'tools/research/aram-rating-v032-b3-audit.js'
      - 'tools/research/aram-rating-v032-b3-runner-audit.js'
      - 'tools/research/aram-rating-v032-b3-evaluator-audit.js'
      - 'tools/research/aram-rating-v032-b4-audit.js'
      - 'tools/research/aram-rating-v032-b4-runner-audit.js'
      - 'tools/research/aram-rating-v032-b4-evaluator-audit.js'
      - 'tools/research/aram-rating-v032-b4-cold-start-diagnostic-audit.js'
      - 'tools/research/aram-rating-v032-b5-preview-audit.js'
      - 'tools/research/aram-rating-v032-b51-preview-audit.js'
      - 'tools/research/aram-rating-v032-b51-runner-audit.js'
      - 'tools/research/aram-rating-v032-b51r2-preflight-audit.js'
      - 'tools/research/aram-rating-v032-b51r3-preflight-audit.js'
      - 'tools/research/aram-rating-v032-b51r4-preflight-audit.js'
      - 'tools/research/aram-rating-v032-b51r5-preflight-audit.js'
      - 'tools/research/aram-rating-v032-b51r6-forensic-audit.js'
      - 'tools/research/aram-rating-v032-b51r7-repair-preview-audit.js'
      - 'tools/research/aram-rating-v032-b51r8-repair-audit.js'
      - 'tools/research/aram-rating-v032-b51r9-recovery-audit.js'
      - 'tools/research/aram-rating-v032-b51r10-recovery-audit.js'
      - 'tools/research/aram-rating-v032-b51r11-evaluator-audit.js'
      - 'tools/research/aram-rating-v032-b51r12-targeted-plan-audit.js'
      - 'tools/research/aram-rating-v032-b51r13-auto-targeted-audit.js'
      - 'tools/research/aram-rating-v032-b51r14-final-evaluator-audit.js'
      - 'tools/research/aram-rating-v032-r15-dual-shadow-audit.js'
      - 'tools/research/aram-rating-v032-r16-shadow-promotion-gate-audit.js'
      - 'tools/research/aram-rating-v032-r17-installed-shadow-rc-audit.js'
      - 'tools/research/aram-rating-v032-r18-build-installed-shadow-rc-kit.js'
      - 'tools/research/aram-rating-v032-r18-installed-shadow-rc-kit-audit.js'
      - '.github/workflows/aram-rating-v032-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy-first-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run synthetic/offline v0.3.2 audit
        run: node tools/research/aram-rating-v032-audit.js
      - name: Run B3 density-first preview audit
        run: node tools/research/aram-rating-v032-b3-audit.js
      - name: Run B3 manual runner safety audit
        run: node tools/research/aram-rating-v032-b3-runner-audit.js
      - name: Run B3 1000 evaluator safety audit
        run: node tools/research/aram-rating-v032-b3-evaluator-audit.js
      - name: Run B4 mature-network preview audit
        run: node tools/research/aram-rating-v032-b4-audit.js
      - name: Run B4 mature-network runner safety audit
        run: node tools/research/aram-rating-v032-b4-runner-audit.js
      - name: Run B4 mature-network evaluator safety audit
        run: node tools/research/aram-rating-v032-b4-evaluator-audit.js
      - name: Run B4 cold-start diagnostic safety audit
        run: node tools/research/aram-rating-v032-b4-cold-start-diagnostic-audit.js
      - name: Run B5 closed-network preview audit
        run: node tools/research/aram-rating-v032-b5-preview-audit.js
      - name: Run B5.1 match-level closed preview audit
        run: node tools/research/aram-rating-v032-b51-preview-audit.js
      - name: Run B5.1 evidence-first manual runner safety audit
        run: node tools/research/aram-rating-v032-b51-runner-audit.js
      - name: Run B5.1 R2 one-shot preflight safety audit
        run: node tools/research/aram-rating-v032-b51r2-preflight-audit.js
      - name: Run B5.1 R3 exact legacy-shape preflight safety audit
        run: node tools/research/aram-rating-v032-b51r3-preflight-audit.js
      - name: Run B5.1 R4 second-anchor preflight safety audit
        run: node tools/research/aram-rating-v032-b51r4-preflight-audit.js
      - name: Run B5.1 R5 two-request sequence preflight safety audit
        run: node tools/research/aram-rating-v032-b51r5-preflight-audit.js
      - name: Run B5.1 R6 checkpoint forensic audit
        run: node tools/research/aram-rating-v032-b51r6-forensic-audit.js
      - name: Run B5.1 R7 repair preview audit
        run: node tools/research/aram-rating-v032-b51r7-repair-preview-audit.js
      - name: Run B5.1 R8 guarded completion-state repair audit
        run: node tools/research/aram-rating-v032-b51r8-repair-audit.js
      - name: Run B5.1 R9 guarded one-anchor recovery audit
        run: node tools/research/aram-rating-v032-b51r9-recovery-audit.js
      - name: Run B5.1 R10 guarded three-anchor recovery audit
        run: node tools/research/aram-rating-v032-b51r10-recovery-audit.js
      - name: Run B5.1 R11 post-R10 read-only evaluator audit
        run: node tools/research/aram-rating-v032-b51r11-evaluator-audit.js
      - name: Run B5.1 R12 targeted information-gain planner audit
        run: node tools/research/aram-rating-v032-b51r12-targeted-plan-audit.js
      - name: Run B5.1 R13 bounded auto-targeted collector audit
        run: node tools/research/aram-rating-v032-b51r13-auto-targeted-audit.js
      - name: Run B5.1 R14 final shadow-decision evaluator audit
        run: node tools/research/aram-rating-v032-b51r14-final-evaluator-audit.js
      - name: Run R15 canonical Elo Glicko dual shadow audit
        run: node tools/research/aram-rating-v032-r15-dual-shadow-audit.js
      - name: Run R16 shadow promotion gate audit
        run: node tools/research/aram-rating-v032-r16-shadow-promotion-gate-audit.js
      - name: Run R17 passive installed shadow RC audit
        run: node tools/research/aram-rating-v032-r17-installed-shadow-rc-audit.js
      - name: Build R18 installed shadow RC kit
        run: node tools/research/aram-rating-v032-r18-build-installed-shadow-rc-kit.js
      - name: Run R18 installed shadow RC kit audit
        run: node tools/research/aram-rating-v032-r18-installed-shadow-rc-kit-audit.js
      - name: Upload aggregate/synthetic audits only
        uses: actions/upload-artifact@v4
        with:
          name: aram-rating-v032-research-audit
          path: |
            audit-output/aram-rating-v032-audit.json
            audit-output/aram-rating-v032-b3-audit.json
            audit-output/aram-rating-v032-b3-runner-audit.json
            audit-output/aram-rating-v032-b3-evaluator-audit.json
            audit-output/aram-rating-v032-b4-audit.json
            audit-output/aram-rating-v032-b4-runner-audit.json
            audit-output/aram-rating-v032-b4-evaluator-audit.json
            audit-output/aram-rating-v032-b4-cold-start-diagnostic-audit.json
            audit-output/aram-rating-v032-b5-preview-audit.json
            audit-output/aram-rating-v032-b51-preview-audit.json
            audit-output/aram-rating-v032-b51-runner-audit.json
            audit-output/aram-rating-v032-b51r2-preflight-audit.json
            audit-output/aram-rating-v032-b51r3-preflight-audit.json
            audit-output/aram-rating-v032-b51r4-preflight-audit.json
            audit-output/aram-rating-v032-b51r5-preflight-audit.json
            audit-output/aram-rating-v032-b51r6-forensic-audit.json
            audit-output/aram-rating-v032-b51r7-repair-preview-audit.json
            audit-output/aram-rating-v032-b51r8-repair-audit.json
            audit-output/aram-rating-v032-b51r9-recovery-audit.json
            audit-output/aram-rating-v032-b51r10-recovery-audit.json
            audit-output/aram-rating-v032-b51r11-evaluator-audit.json
            audit-output/aram-rating-v032-b51r12-targeted-plan-audit.json
            audit-output/aram-rating-v032-b51r13-auto-targeted-audit.json
            audit-output/aram-rating-v032-b51r14-final-evaluator-audit.json
            audit-output/aram-rating-v032-r15-dual-shadow-audit.json
            audit-output/aram-rating-v032-r16-shadow-promotion-gate-audit.json
            audit-output/aram-rating-v032-r17-installed-shadow-rc-audit.json
            audit-output/aram-rating-v032-r18-installed-shadow-rc-kit-audit.json
            audit-output/r17-installed-shadow-rc-kit/**
          if-no-files-found: error
